  box.innerHTML = `<div class="summary-row"><span class="pill">${t('students')}: ${MONTHLY_CACHE.length}</span><span style="flex:1"></span><button class="btn btn-sm" data-act="monthly-csv">${ic('download', 14)} CSV</button><button class="btn btn-sm" data-act="monthly-print">${ic('printer', 14)} ${t('print')}</button></div>
    ${MONTHLY_CACHE.length ? `<div class="table-wrap">${tableHTML(MONTHLY_COLS(), MONTHLY_CACHE)}</div>` : emptyState(t('no_attendance_month'))}`;
}
const MONTHLY_COLS = () => [{ k: 'admission_no', l: t('admission_no') }, { k: 'full_name', l: t('student') }, { k: 'class_section', l: t('class_section') }, ...ATT_STATUS.map(s => ({ k: s, l: t('st_' + s), num: true })), { k: 'total', l: t('total'), num: true }, { k: 'rate', l: t('attendance_rate'), num: true }];
ACT['monthly-csv'] = () => downloadCSV('attendance-' + ATT.monthly.month, MONTHLY_COLS(), MONTHLY_CACHE);
ACT['monthly-print'] = () => printDoc(`<div class="sheet">${letterhead(t('monthly_report'), ATT.monthly.month)}${tableHTML(MONTHLY_COLS(), MONTHLY_CACHE)}</div>`, t('monthly_report'));

/* ---- student history ---- */
function viewHistory(body) {
  body.innerHTML = `<div class="filters"><div id="h-pick" style="flex:1;min-width:240px;max-width:380px"></div><input type="date" id="h-from" value="${ATT.histFrom}" max="${todayStr()}" aria-label="${t('from')}"><input type="date" id="h-to" value="${ATT.histTo}" max="${todayStr()}" aria-label="${t('to')}"></div><div id="h-out"></div>`;
  studentPicker($('#h-pick', body), { onPick: r => { ATT.hist = { id: r.id, name: r.full_name, adm: r.admission_no }; loadHistory(); } });
  ['h-from', 'h-to'].forEach(i => $('#' + i, body).addEventListener('change', e => { if (i === 'h-from') ATT.histFrom = e.target.value; else ATT.histTo = e.target.value; loadHistory(); }));
  loadHistory();
}
let HIST_CACHE = [];
async function loadHistory() {
  const box = $('#h-out'); if (!box) return;
  if (!ATT.hist) { box.innerHTML = emptyState(t('pick_student'), 'users'); return; }
  box.innerHTML = skeleton();
  const id = ATT.hist.id;
  let rows;
  try { rows = await fetchAll(() => sb.from('attendance_records').select('id,status,note, attendance_sessions!inner(session_date,section_id)').eq('student_id', id).gte('attendance_sessions.session_date', ATT.histFrom).lte('attendance_sessions.session_date', ATT.histTo).order('id')); }
  catch (e) { box.innerHTML = `<div class="card-pad"><div class="alert err">${esc(errMsg(e))}</div></div>`; return; }
  rows.sort((a, b) => b.attendance_sessions.session_date.localeCompare(a.attendance_sessions.session_date));
  const cnt = Object.fromEntries(ATT_STATUS.map(s => [s, 0])); rows.forEach(r => cnt[r.status]++);
  HIST_CACHE = rows.map(r => ({ date: r.attendance_sessions.session_date, class_section: classLabel(byId(S.sections, r.attendance_sessions.section_id)?.class_id, r.attendance_sessions.section_id), status: t('st_' + r.status), note: r.note || '', _s: r.status }));
  box.innerHTML = `<div class="summary-row"><b>${esc(ATT.hist.name)}</b><span class="muted">${esc(ATT.hist.adm)}</span><span class="pill">${t('total')}: ${rows.length}</span>${ATT_STATUS.map(s => `<span class="pill">${t('st_' + s)}: ${cnt[s]}</span>`).join('')}<span class="pill">${t('attendance_rate')}: ${rows.length ? pct(cnt.present + cnt.late, rows.length) : 0}%</span>
    <span style="flex:1"></span><button class="btn btn-sm" data-act="hist-csv">${ic('download', 14)} CSV</button><button class="btn btn-sm" data-act="hist-print">${ic('printer', 14)} ${t('print')}</button></div>
    ${rows.length ? `<div class="table-wrap">${tableHTML([{ k: 'dt', l: t('date') }, { k: 'class_section', l: t('class_section') }, { k: 'b', l: t('status'), html: true }, { k: 'note', l: t('note') }], HIST_CACHE.map(r => ({ ...r, dt: fmtDate(r.date), b: badge(r._s) })))}</div>` : emptyState(t('no_records'))}`;
}
const HIST_COLS = () => [{ k: 'date', l: t('date') }, { k: 'class_section', l: t('class_section') }, { k: 'status', l: t('status') }, { k: 'note', l: t('note') }];
ACT['hist-csv'] = () => downloadCSV('attendance-' + (ATT.hist?.adm || 'student'), HIST_COLS(), HIST_CACHE);
ACT['hist-print'] = () => printDoc(`<div class="sheet">${letterhead(t('student_history'), `${ATT.hist.name} (${ATT.hist.adm})`)}${tableHTML(HIST_COLS(), HIST_CACHE)}</div>`, t('student_history'));

/* =====================================================================
   9.6 Examinations & marks
   ===================================================================== */
const EXAM_TYPES = ['quiz', 'test', 'midterm', 'exam', 'assignment'];
const EXM = { tab: 'assessments', a: { term: '', cls: '', page: 1 }, m: { term: '', cls: '', aid: '', sec: '' }, r: { term: '', cls: '', sec: '' }, list: [] };
TABSTATE.exams = EXM;
const defaultTerm = () => { const td = todayStr(); return (S.terms.find(x => x.start_date <= td && td <= x.end_date) || S.terms.find(x => x.academic_year_id === S.curYear?.id) || S.terms[0])?.id || ''; };
const termOpts = () => opt(S.terms, termLabel);

async function renderExams() {
  if (!EXM.a.term) EXM.a.term = EXM.m.term = EXM.r.term = defaultTerm();
  const tabs = [{ id: 'assessments', label: t('assessments') }, { id: 'marks', label: t('enter_marks') }, { id: 'results', label: t('results') }];
  $('#view').innerHTML = pageHead(t('nav_exams'), t('exams_sub'), EXM.tab === 'assessments' && can('marks.write') ? `<button class="btn btn-primary" data-act="asm-new">${ic('plus', 16)} ${t('create_exam')}</button>` : '') + tabsBar(tabs, EXM.tab) + `<div class="card" id="exm-body"></div>`;
  ({ assessments: viewAssessments, marks: viewMarks, results: viewResults })[EXM.tab]($('#exm-body'));
}
/* ---- assessments ---- */
function viewAssessments(body) {
  body.innerHTML = `<div id="a-filters"></div><div id="a-list"></div><div id="a-pager"></div>`;
  filterBar($('#a-filters', body), [{ k: 'term', type: 'select', blank: t('all_terms'), opts: termOpts }, { k: 'cls', type: 'select', blank: t('all_classes'), opts: classOpts }], EXM.a, loadAssessments);
  loadAssessments();
}
async function loadAssessments() {
  const box = $('#a-list'); if (!box) return; box.innerHTML = skeleton(); const st = EXM.a;
  let q = sb.from('assessments').select('*', { count: 'exact' }).eq('school_id', S.school.id);
  if (st.term) q = q.eq('term_id', st.term); if (st.cls) q = q.eq('class_id', st.cls);
  const { data, error, count } = await q.order('exam_date', { ascending: false, nullsFirst: false }).order('created_at', { ascending: false }).range((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE - 1);
  if (error) { box.innerHTML = `<div class="card-pad"><div class="alert err">${esc(errMsg(error))}</div></div>`; return; }
  box.innerHTML = data.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('exam_name')}</th><th>${t('class')}</th><th>${t('subject')}</th><th>${t('term')}</th><th class="num">${t('max_marks')}</th><th>${t('date')}</th><th></th></tr></thead><tbody>
    ${data.map(a => `<tr><td><b>${esc(a.name)}</b><br><span class="muted small">${t('et_' + a.exam_type)}</span></td><td>${esc(nameOf(S.classes, a.class_id))}</td><td>${esc(nameOf(S.subjects, a.subject_id))}</td><td>${esc(nameOf(S.terms, a.term_id))}</td><td class="num">${a.max_marks}</td><td>${fmtDate(a.exam_date)}</td>
    <td><div class="row-actions">${can('marks.write') ? `<button class="btn btn-sm btn-primary" data-act="asm-marks" data-id="${a.id}">${t('enter_marks')}</button><button class="icon-btn" data-act="asm-edit" data-id="${a.id}" title="${t('edit')}">${ic('edit')}</button><button class="icon-btn danger" data-act="asm-del" data-id="${a.id}" data-name="${esc(a.name)}" title="${t('delete')}">${ic('trash')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div>` : emptyState(t('no_exams'));
  EXM.known = Object.fromEntries(data.map(a => [a.id, a]));
  pager($('#a-pager'), { total: count || 0, page: st.page, onPage: p => { st.page = p; loadAssessments(); } });
}
async function openAssessmentForm(id) {
  let ex = id ? EXM.known?.[id] || ok(await sb.from('assessments').select('*').eq('id', id).single()).data : null;
  const fields = [{ k: 'term_id', l: 'term', type: 'select', req: true, opts: termOpts() }, { k: 'class_id', l: 'class', type: 'select', req: true, opts: classOpts() },
    { k: 'subject_id', l: 'subject', type: 'select', req: true, opts: opt(allowedSubjects(ex?.class_id)) }, { k: 'name', l: 'exam_name', req: true, ph: 'Midterm Exam' },
    { k: 'exam_type', l: 'exam_type', type: 'select', req: true, opts: enumOpts(EXAM_TYPES, 'et_') }, { k: 'max_marks', l: 'max_marks', type: 'number', req: true, min: 1, step: '0.01' }, { k: 'exam_date', l: 'date', type: 'date' }];
  formModal({ title: ex ? t('edit_exam') : t('create_exam'), fields, values: ex || { term_id: EXM.a.term || defaultTerm(), class_id: EXM.a.cls, exam_type: 'exam', max_marks: 100 },
    onMount: (el, form) => { const sync = () => fillSelect(form.elements.subject_id, opt(allowedSubjects(form.elements.class_id.value)), '', t('select_opt')); form.elements.class_id.addEventListener('change', sync); if (!ex && form.elements.class_id.value) sync(); },
    onSubmit: async v => {
      const term = byId(S.terms, v.term_id), payload = { ...v, academic_year_id: term.academic_year_id, exam_type: v.exam_type || 'exam' };
      if (ex) ok(await sb.from('assessments').update(payload).eq('id', ex.id)); else ok(await sb.from('assessments').insert({ ...payload, school_id: S.school.id, created_by: S.user.id }));
      toast(t('saved')); loadAssessments();
    } });
}
ACT['asm-new'] = () => openAssessmentForm();
ACT['asm-edit'] = el => openAssessmentForm(el.dataset.id);
ACT['asm-del'] = async el => {
  if (!await confirmBox({ title: t('delete'), message: t('confirm_delete_exam', { name: el.dataset.name }), danger: true, okLabel: t('delete') })) return;
  ok(await sb.from('assessments').delete().eq('id', el.dataset.id)); toast(t('deleted')); loadAssessments();
};
ACT['asm-marks'] = el => { const a = EXM.known[el.dataset.id]; EXM.tab = 'marks'; Object.assign(EXM.m, { term: a.term_id, cls: a.class_id, aid: a.id, sec: '' }); route(); };

/* ---- marks entry ---- */
async function loadAssessmentList() {
  const m = EXM.m; if (!m.term || !m.cls) { EXM.list = []; return; }
  EXM.list = ok(await sb.from('assessments').select('*').eq('school_id', S.school.id).eq('term_id', m.term).eq('class_id', m.cls).order('name')).data || [];
  if (!EXM.list.some(a => a.id === m.aid)) m.aid = '';
}
async function viewMarks(body) {
  const m = EXM.m; await loadAssessmentList();

const normH = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const IMP_ALIASES = {
  adm: ['admissionno', 'admission', 'adm', 'admno', 'idno', 'id', 'lambarka'],
  name: ['fullname', 'name', 'studentname', 'student', 'magac', 'magaca', 'magacaardayga'],
  gender: ['gender', 'sex', 'jinsi', 'jinsiga'],
  dob: ['dateofbirth', 'dob', 'birthdate', 'birthday', 'dhalasho', 'taariikhdadhalashada'],
  phone: ['phone', 'telephone', 'tel', 'mobile', 'telefoon', 'taleefan'],
  address: ['address', 'cinwaan', 'cinwaanka'],
  cls: ['class', 'grade', 'fasal', 'fasalka'],
  sec: ['section', 'qayb', 'qaybta'],
  g_name: ['guardianname', 'guardian', 'parent', 'parentname', 'waalid', 'waalidka', 'magacawaalidka'],
  g_phone: ['guardianphone', 'parentphone', 'waalidphone', 'waalidtelefoon', 'telefoonkawaalidka'],
  g_rel: ['relationship', 'relation', 'xidhiidh', 'xidhiidhka']
};
const IMP_TEMPLATE = 'admission_no,full_name,gender,date_of_birth,phone,address,class,section,guardian_name,guardian_phone,relationship\n,Amina Ali Hassan,female,12/03/2015,,Hodan,Grade 5,A,Ali Hassan,0912345678,Father\n,Mohamed Nur Abdi,male,2014-08-30,,Bakaaro,Grade 5,A,Nur Abdi,0911223344,Father\n';

function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
const impGender = v => { const x = normH(v); if (!x) return null; if (['m', 'male', 'lab', 'ragga', 'boy', 'wiil'].includes(x)) return 'male'; if (['f', 'female', 'dhedig', 'dumar', 'girl', 'gabadh'].includes(x)) return 'female'; return undefined; };
function impDate(v) {
  v = String(v || '').trim(); if (!v) return null; let y, m, d, a;
  if ((a = v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) { y = +a[1]; m = +a[2]; d = +a[3]; }
  else if ((a = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) { d = +a[1]; m = +a[2]; y = +a[3]; }
  else return undefined;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return undefined;
  const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  return iso < todayStr() ? iso : undefined;
}
const PHONE_RE = /^[0-9+()\-\s]{6,20}$/;
const normC = s => String(s || '').toLowerCase().replace(/\b(grade|class|fasalka|fasal)\b/g, '').replace(/[^a-z0-9]/g, '');
const impClass = name => { if (!name) return null; const n = normC(name); return S.classes.find(c => c.name.toLowerCase() === name.toLowerCase()) || (n && S.classes.find(c => normC(c.name) === n)) || null; };

async function existingAdm() {
  const set = new Set();
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('students').select('admission_no').eq('school_id', S.school.id).order('id').range(from, from + 999);
    if (error) throw error;
    (data || []).forEach(r => set.add(String(r.admission_no).toLowerCase()));
    if (!data || data.length < 1000) break;
  }
  return set;
}

async function impBuild(text, ctx) {
  const rows = parseCSV(text);
  if (rows.length < 2) return { error: t('imp_empty') };
  const head = rows[0].map(normH), idx = {};
  for (const [k, al] of Object.entries(IMP_ALIASES)) idx[k] = head.findIndex(h => al.includes(h));
  if (idx.name < 0) return { error: t('imp_no_name_col') };
  const body = rows.slice(1);
  if (body.length > 2000) return { error: t('imp_too_many') };
  const g = (r, k) => idx[k] >= 0 ? String(r[idx[k]] ?? '').trim() : '';
  const have = await existingAdm(), explicit = new Set(), seen = new Set();
  body.forEach(r => { const a = g(r, 'adm').toLowerCase(); if (a) explicit.add(a); });
  const yr = byId(S.years, ctx.year), prefix = `ADM-${(yr?.name || '').slice(0, 4) || new Date().getFullYear()}-`;
  let n = have.size;
  const next = () => { let s; do { n++; s = prefix + String(n).padStart(4, '0'); } while (have.has(s.toLowerCase()) || explicit.has(s.toLowerCase()) || seen.has(s.toLowerCase())); return s; };
  const out = body.map((r, i) => {
    const errs = [], v = { name: g(r, 'name'), address: g(r, 'address') || null, g_name: g(r, 'g_name') || null, g_rel: g(r, 'g_rel') || null };
    if (v.name.length < 2) errs.push(t('imp_e_name'));
    let adm = g(r, 'adm');
    if (adm) { const l = adm.toLowerCase(); if (have.has(l)) errs.push(t('imp_e_adm_exists')); else if (seen.has(l)) errs.push(t('imp_e_adm_dup')); seen.add(l); } else adm = null;
    v.adm = adm;
    const ge = impGender(g(r, 'gender')); if (ge === undefined) errs.push(t('imp_e_gender')); v.gender = ge ?? null;
    const dob = impDate(g(r, 'dob')); if (dob === undefined) errs.push(t('imp_e_dob')); v.dob = dob ?? null;
    const ph = g(r, 'phone'); if (ph && !PHONE_RE.test(ph)) errs.push(t('imp_e_phone')); v.phone = ph || null;
    const gp = g(r, 'g_phone'); if (gp && !PHONE_RE.test(gp)) errs.push(t('imp_e_gphone')); v.g_phone = gp || null;
    // class + section
    const cn = g(r, 'cls'), sn = g(r, 'sec');
    const cls = cn ? impClass(cn) : (ctx.cls ? byId(S.classes, ctx.cls) : null);
    if (!cls) errs.push(t('imp_e_class'));
    else {
      v.class_id = cls.id; const secs = sectionsOf(cls.id);
      let sec = null;
      if (sn) sec = secs.find(s => s.name.toLowerCase() === sn.toLowerCase()) || null;
      else if (ctx.sec && ctx.cls === cls.id) sec = secs.find(s => s.id === ctx.sec) || null;
      else if (secs.length === 1) sec = secs[0];
      if (!sec) errs.push(t('imp_e_section')); else v.section_id = sec.id;
    }
    return { line: i + 2, errs, v };
  });
  out.forEach(r => { if (!r.v.adm && !r.errs.length) { r.v.adm = next(); seen.add(r.v.adm.toLowerCase()); } });   // number only the valid rows
  return { rows: out };
}

async function impRun(valid, ctx, onProgress) {
  const sid = S.school.id; let done = 0, warn = 0; const failed = [];
  for (let i = 0; i < valid.length; i += 100) {
    const chunk = valid.slice(i, i + 100);
    const ins = await sb.from('students').insert(chunk.map(r => ({ school_id: sid, admission_no: r.v.adm, full_name: r.v.name, gender: r.v.gender, date_of_birth: r.v.dob, phone: r.v.phone, address: r.v.address, status: 'active', admission_date: todayStr() }))).select('id,admission_no');
    if (ins.error) { failed.push(errMsg(ins.error)); continue; }
    const ids = new Map(ins.data.map(s => [s.admission_no, s.id]));
    const en = await sb.from('enrollments').insert(chunk.map(r => ({ school_id: sid, student_id: ids.get(r.v.adm), academic_year_id: ctx.year, class_id: r.v.class_id, section_id: r.v.section_id })));
    if (en.error) { await sb.from('students').delete().in('id', [...ids.values()]); failed.push(errMsg(en.error)); continue; }
    const gmap = new Map(), gRows = [], links = [];
    chunk.forEach(r => {
      if (!r.v.g_name) return;
      const key = (r.v.g_phone || '') + '|' + r.v.g_name.toLowerCase(); let gid = gmap.get(key);
      if (!gid) { gid = crypto.randomUUID(); gmap.set(key, gid); gRows.push({ id: gid, school_id: sid, full_name: r.v.g_name, phone: r.v.g_phone }); }
      links.push({ school_id: sid, student_id: ids.get(r.v.adm), guardian_id: gid, relationship: r.v.g_rel, is_primary: true });
    });
    if (gRows.length) {
      const g = await sb.from('guardians').insert(gRows);
      if (g.error) warn += links.length; else { const l = await sb.from('student_guardians').insert(links); if (l.error) warn += links.length; }
    }
    done += chunk.length; onProgress(done);
  }
  return { done, warn, failed };
}

async function fetchFilteredStudents(max = 3000) {
  const filterEnr = STU.cls || STU.sec || STU.year, out = [];
  for (let from = 0; from < max; from += 500) {
    let q = sb.from('students').select(`*, enrollments${filterEnr ? '!inner' : ''}(id,academic_year_id,class_id,section_id), student_guardians(guardians(full_name,phone))`).eq('school_id', S.school.id);
    const s = sanitizeQ(STU.q); if (s) q = q.or(`full_name.ilike.%${s}%,admission_no.ilike.%${s}%,phone.ilike.%${s}%`);
    if (STU.status) q = q.eq('status', STU.status); if (STU.gender) q = q.eq('gender', STU.gender);
    if (STU.cls) q = q.eq('enrollments.class_id', STU.cls); if (STU.sec) q = q.eq('enrollments.section_id', STU.sec); if (STU.year) q = q.eq('enrollments.academic_year_id', STU.year);

}

      summary: [[t('invoiced_month'), money(invs.reduce((a, i) => a + +i.amount, 0))], [t('collected'), money(total)], [t('payments'), pays.length], ...Object.entries(byM).map(([m, v]) => [t('pm_' + m), money(v)])] }; } },
  outstanding: { perm: 'fees.read', params: ['cls'], run: async () => {
    const sid = S.school.id;
    const [invs, enr] = await Promise.all([
      fetchAll(() => sb.from('invoices').select('student_id,amount,amount_paid,due_date,students(full_name,admission_no)').eq('school_id', sid).in('status', ['unpaid', 'partial']).order('id')),
      REP.cls ? fetchAll(() => sb.from('enrollments').select('student_id,class_id,section_id').eq('school_id', sid).eq('academic_year_id', S.curYear?.id).order('student_id')) : Promise.resolve([])]);
    const en = Object.fromEntries(enr.map(e => [e.student_id, e])), g = {};
    invs.forEach(i => { if (REP.cls && en[i.student_id]?.class_id !== REP.cls) return; const x = g[i.student_id] ||= { adm: i.students?.admission_no, name: i.students?.full_name, n: 0, amount: 0, paid: 0, oldest: null, sid: i.student_id };
      x.n++; x.amount += +i.amount; x.paid += +i.amount_paid; if (i.due_date && (!x.oldest || i.due_date < x.oldest)) x.oldest = i.due_date; });
    const list = Object.values(g).sort((a, b) => (b.amount - b.paid) - (a.amount - a.paid));
    const rows = list.map(x => ({ admission_no: x.adm, full_name: x.name, class_section: en[x.sid] ? classLabel(en[x.sid].class_id, en[x.sid].section_id) : '', n: x.n, amount: nf2.format(x.amount), paid: nf2.format(x.paid), balance: nf2.format(x.amount - x.paid), oldest: x.oldest ? fmtDate(x.oldest) : '' }));
    return { title: t('rep_outstanding'), cols: [['admission_no', t('admission_no')], ['full_name', t('student')], ['class_section', t('class_section')], ['n', t('invoices'), true], ['amount', t('amount'), true], ['paid', t('paid'), true], ['balance', t('balance'), true], ['oldest', t('oldest_due')]].map(([k, l, n]) => ({ k, l, num: n })), rows,
      summary: [[t('students'), list.length], [t('outstanding'), money(list.reduce((a, x) => a + x.amount - x.paid, 0))]] }; } }
};

function setSchool(body) {

    { k: 'default_language', l: 'language', type: 'select', req: true, opts: [{ v: 'en', l: 'English' }, { v: 'so', l: 'Soomaali' }] }].map(f => field(f, s[f.k])).join('')}

}
const resizeLogo = (file, max = 256) => new Promise((res, rej) => {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('Image error')), 'image/png'); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(t('photo_failed'))); }; img.src = url;
});
async function setLogoPath(url) {
  const r = ok(await sb.from('schools').update({ logo_path: url }).eq('id', S.school.id).select('id,logo_path')).data;
  if (!r || !r.length) throw new Error(t('ft_no_change'));
  S.school.logo_path = url; S.member.schools = S.school; renderShell(); toast(t('saved')); renderSettings();
}
async function saveLogo(file) {
  try {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error(t('logo_type'));
    if (file.size > 8 * 1024 * 1024) throw new Error(t('logo_big'));
    const blob = await resizeLogo(file), path = `${S.school.id}/logo.png`;
    ok(await sb.storage.from('school-logos').upload(path, blob, { contentType: 'image/png', upsert: true, cacheControl: '60' }));
    await setLogoPath(sb.storage.from('school-logos').getPublicUrl(path).data.publicUrl + '?v=' + Date.now());
  } catch (err) { handleErr(err); }
}

/* =====================================================================
   10. BOOT
   ===================================================================== */
(function boot() {
  setLang(LANG);
  if (!CONFIGURED || !sb) { showSetup(); return; }
  sb.auth.onAuthStateChange((ev, session) => {
    // never await Supabase calls inside this callback (deadlock risk) - defer with setTimeout
    if (ev === 'PASSWORD_RECOVERY') { recovery = true; setTimeout(() => showAuth('reset'), 0); return; }
    if (ev === 'SIGNED_OUT') { S.user = null; S.school = null; setTimeout(() => showAuth('login'), 0); return; }
    if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN') {
      if (recovery) return;
      if (session && S.user && S.user.id === session.user.id) return;   // token refresh / tab refocus
      setTimeout(() => start(session), 0);
    }
  });
  // fallback: if the auth event never arrives, read the stored session directly
  setTimeout(async () => { if (!$('#boot').hidden && !starting) { try { const { data } = await sb.auth.getSession(); start(data.session); } catch (e) { showAuth('login', errMsg(e)); } } }, 2500);
  // hard fallback: never leave the user on an endless spinner
  setTimeout(() => { if (!$('#boot').hidden) showAuth('noaccess', 'Could not reach Supabase. Check SUPABASE_URL / SUPABASE_KEY in index.html and your internet connection.'); }, 12000);
  document.addEventListener('click', e => { const a = e.target.closest('a[href^="#/"]'); if (a) document.body.classList.remove('nav-open'); });
})();
