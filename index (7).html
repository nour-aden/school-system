<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Management System</title>
<meta name="description" content="School Management System for Ethiopian schools — students, attendance, exams, fees and reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Visible error reporter: if anything breaks, show the message instead of a blank page -->
<script>
(function(){function show(m){var d=document.getElementById('fatal');if(!d){d=document.createElement('div');d.id='fatal';d.style.cssText='position:fixed;z-index:999;left:12px;right:12px;bottom:12px;background:#fdecec;color:#991b1b;border:1px solid #f5c2c2;border-radius:10px;padding:12px;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap';document.documentElement.appendChild(d);}d.textContent='Error: '+m;}
window.addEventListener('error',function(e){show((e.message||'script error')+(e.filename?' ('+String(e.filename).split('/').pop()+':'+e.lineno+')':''));});
window.addEventListener('unhandledrejection',function(e){show((e.reason&&e.reason.message)||String(e.reason));});
window.addEventListener('load',function(){if(!window.supabase)show('Supabase library did not load (check internet / ad-blocker).');});})();
</script>
<!-- Supabase JavaScript client (loaded from CDN, pinned version) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root{
  --bg:#f4f6fb; --surface:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e5e9f2;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eaf1ff; --navy:#0f2557; --navy2:#16336e;
  --green:#15803d; --green-l:#e6f6ec; --red:#dc2626; --red-l:#fdecec; --amber:#b45309; --amber-l:#fff3dc; --slate-l:#eef1f6;
  --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --side:260px; --top:64px;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.muted{color:var(--ink2)} .small{font-size:12px} .right{text-align:right} .center{text-align:center}
.mono{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}

/* ---------- boot spinner ---------- */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200}
.spinner{width:34px;height:34px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--slate-l)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn:not(.btn-primary):not(.btn-danger).busy::after{border-color:var(--line);border-top-color:var(--blue)}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative}
.icon-btn:hover{background:var(--slate-l);color:var(--ink)}
.icon-btn.danger:hover{background:var(--red-l);color:var(--red)}
.dot{position:absolute;top:4px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fg{display:flex;flex-direction:column;gap:5px;min-width:0}
.fg.full{grid-column:1/-1}
.fg>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.fg .req{color:var(--red)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{
  width:100%;height:38px;padding:0 12px;border:1px solid #d5dbe8;border-radius:9px;background:#fff;outline:none;transition:.15s}
textarea{height:auto;padding:10px 12px;min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
input:disabled,select:disabled{background:var(--slate-l);color:var(--ink2)}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px}
.help{font-size:12px;color:var(--ink3)}
.section-title{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:6px;border-top:1px solid var(--line);padding-top:14px}

/* ---------- auth ---------- */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-brand{background:linear-gradient(150deg,var(--navy) 0%,#1e4ba8 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.auth-brand h1{font-size:34px;font-weight:700;letter-spacing:-.02em;max-width:460px}
.auth-brand p{color:#c7d6f5;max-width:440px;font-size:15px}
.auth-feats{display:grid;gap:12px;margin-top:28px}
.auth-feats div{display:flex;gap:10px;align-items:center;color:#dbe6ff}
.auth-side{display:grid;place-items:center;padding:28px;background:#fff;position:relative}
.auth-card{width:100%;max-width:380px}
.auth-card h2{font-size:24px;margin-bottom:6px}
.auth-card form{display:grid;gap:14px;margin-top:22px}
.auth-lang{position:absolute;top:18px;right:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.alert{padding:10px 12px;border-radius:9px;font-size:13px;border:1px solid}
.alert.err{background:var(--red-l);border-color:#f5c2c2;color:#991b1b}
.alert.ok{background:var(--green-l);border-color:#bfe5cc;color:var(--green)}
.alert.warn{background:var(--amber-l);border-color:#f3d9a4;color:var(--amber)}

/* ---------- app shell ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#cbd8f6;display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.sidebar .brand{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 20px;color:#fff;font-weight:700;font-size:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar nav{padding:14px 12px;display:grid;gap:3px;overflow-y:auto;flex:1;align-content:start}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#cbd8f6;font-weight:500;position:relative}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#60a5fa}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#93a8d6}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55}
.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;height:var(--top);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;z-index:40}
.topbar .title{font-weight:700;font-size:16px;white-space:nowrap}
.topbar .grow{flex:1}
.hamburger{display:none}
.gsearch{position:relative;width:280px}
.gsearch .search input{height:36px}
.view{padding:24px;max-width:1500px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;color:var(--ink2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--slate-l);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-weight:600;font-size:12px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- menus ---------- */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(15,23,42,.16);padding:6px;z-index:80}
.menu.wide{width:340px}
.menu-head{padding:10px 12px;border-bottom:1px solid var(--line);margin:-6px -6px 6px}
.menu-item{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink)}
.menu-item:hover{background:var(--slate-l)}
.menu-item.danger{color:var(--red)}
.notif{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink);align-items:flex-start}
.notif:hover{background:var(--slate-l)}
.notif .ni{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(15,23,42,.16);padding:6px;z-index:80;max-height:320px;overflow:auto}
.pop button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pop button:hover{background:var(--slate-l)}

/* ---------- cards / stats ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:18px}
.stat{display:flex;gap:14px;align-items:center;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.tone-blue{background:var(--blue-l);color:var(--blue)} .tone-green{background:var(--green-l);color:var(--green)}
.tone-red{background:var(--red-l);color:var(--red)} .tone-amber{background:var(--amber-l);color:var(--amber)} .tone-slate{background:var(--slate-l);color:var(--ink2)}
.stat-v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat-l{color:var(--ink2);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}

/* ---------- charts ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding:14px 8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar-stack{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:7px 7px 0 0;overflow:hidden;background:var(--slate-l);min-height:3px}
.bar-stack i{display:block}
.bar-lab{font-size:11px;color:var(--ink2);margin-top:6px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.c-present{--c:#2563eb;background:#2563eb}.c-absent{--c:#ef4444;background:#ef4444}.c-late{--c:#f59e0b;background:#f59e0b}.c-excused{--c:#94a3b8;background:#94a3b8}
.hbar{display:grid;grid-template-columns:90px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:12.5px}
.hbar .track{height:9px;background:var(--slate-l);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:6px}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--slate-l);margin:10px 0}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:left;font-weight:600;padding:11px 16px;background:#f8fafd;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:#fafcff}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:#f8fafd}
.cell-user{display:flex;align-items:center;gap:11px;min-width:0}
.cell-user b{display:block;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;font-size:26px;border-radius:18px}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-l);color:var(--green)}.b-red{background:var(--red-l);color:var(--red)}.b-amber{background:var(--amber-l);color:var(--amber)}.b-blue{background:var(--blue-l);color:var(--blue-d)}.b-gray{background:var(--slate-l);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--slate-l);border-radius:7px;padding:2px 8px;font-size:12px;color:var(--ink2);border:0}
button.chip{cursor:pointer}button.chip:hover{background:var(--blue-l);color:var(--blue)}
.empty{padding:46px 20px;text-align:center;color:var(--ink2)}
.empty .ic{color:var(--ink3);width:38px;height:38px;margin-bottom:8px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#eef1f6 25%,#f8fafc 37%,#eef1f6 63%);background-size:400% 100%;animation:sh 1.3s infinite;margin:16px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- filters / tabs / pager ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.filters select,.filters input[type=date],.filters input[type=month]{width:auto;min-width:140px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--ink3);pointer-events:none}
.search input{padding-left:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue);border-color:var(--blue)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;gap:8px}
.pager-btns{display:flex;gap:10px;align-items:center}

/* ---------- attendance ---------- */
.att-status{display:inline-flex;gap:4px;flex-wrap:wrap}
.att-status label{cursor:pointer}
.att-status input{position:absolute;opacity:0;pointer-events:none}
.att-status span{display:inline-block;padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);background:#fff;user-select:none}
.att-status input:checked+span.s-present{background:#2563eb;color:#fff;border-color:#2563eb}
.att-status input:checked+span.s-absent{background:#ef4444;color:#fff;border-color:#ef4444}
.att-status input:checked+span.s-late{background:#f59e0b;color:#fff;border-color:#f59e0b}
.att-status input:checked+span.s-excused{background:#64748b;color:#fff;border-color:#64748b}
.att-status input:disabled+span{opacity:.6;cursor:not-allowed}
.att-note{min-width:150px}
.summary-row{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.pill{padding:6px 12px;border-radius:10px;background:var(--slate-l);font-weight:600;font-size:12.5px}
.sticky-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:flex-end;gap:10px;border-radius:0 0 var(--radius) var(--radius)}
.mark-input{width:96px!important;text-align:right}
.mark-input.bad{border-color:var(--red);background:var(--red-l)}

/* ---------- modal / toast ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(15,23,42,.3);animation:pop .18s}
.modal.sm{max-width:420px}.modal.lg{max-width:900px}.modal.xl{max-width:1100px}
@keyframes pop{from{transform:translateY(10px);opacity:.4}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);grid-column:1/-1}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.kv div small{display:block;color:var(--ink3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
#toast-root{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:300;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:flex-start;background:#0f172a;color:#fff;padding:12px 14px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:260px;max-width:420px;animation:pop .2s}
.toast.error{background:#991b1b}.toast.success{background:#166534}.toast.warn{background:#92400e}

.asg{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
@media (max-width:640px){.asg{grid-template-columns:1fr 1fr}}
/* ---------- printing ---------- */
#print-root{display:none}
.sheet{font-family:'Inter',Arial,sans-serif;color:#000;font-size:12px}
.sheet h1{font-size:20px;margin:0}.sheet h2{font-size:15px;margin:2px 0 10px}
.sheet .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1d4ed8;padding-bottom:10px;margin-bottom:14px;gap:14px}
.sheet table{width:100%;border-collapse:collapse;margin:8px 0}
.sheet th,.sheet td{border:1px solid #bbb;padding:5px 8px;text-align:left}
.sheet th{background:#eef3fc}.sheet td.num,.sheet th.num{text-align:right}
.sheet .sum{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.sheet .sign{display:flex;justify-content:space-between;margin-top:46px}.sheet .sign div{border-top:1px solid #000;padding-top:4px;width:30%;text-align:center}
.sheet.page{page-break-after:always}
@media print{
  body.printing{background:#fff}
  body.printing > *:not(#print-root){display:none!important}
  body.printing #print-root{display:block!important}
  @page{margin:14mm}
}

/* ---------- responsive ---------- */

/* ===== NEW LOOK (hero, logo, colours) ===== */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,#0f2557 0%,#1d4ed8 70%,#3b82f6 100%);box-shadow:0 10px 30px rgba(29,78,216,.28)}
.hero>*{position:relative;z-index:1}
.hero>.hero-art{position:absolute;z-index:0;right:-6px;top:50%;transform:translateY(-50%);width:230px;opacity:.9}
.hero-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hero-top b{display:block;font-size:15px;line-height:1.2}
.hero-top span{display:block;font-size:12px;opacity:.75}
.hero h2{font-size:23px;margin:0 0 2px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.85;font-size:13.5px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.25}
.hero-chip b{display:block;font-size:18px}
.hero-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;background:#fff;color:#1d4ed8;font-weight:700;font-size:13px;border:0;cursor:pointer;text-decoration:none}
.hero-btn.ghost{background:rgba(255,255,255,.18);color:#fff}
@media(max-width:560px){.hero>.hero-art{width:150px;opacity:.28}.hero h2{font-size:20px}}
.stat{transition:transform .15s,box-shadow .15s}.stat:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.1)}
.stat-ic.tone-blue{background:linear-gradient(135deg,#60a5fa,#1d4ed8);color:#fff}.stat-ic.tone-green{background:linear-gradient(135deg,#4ade80,#15803d);color:#fff}
.stat-ic.tone-red{background:linear-gradient(135deg,#f87171,#b91c1c);color:#fff}.stat-ic.tone-amber{background:linear-gradient(135deg,#fbbf24,#b45309);color:#fff}
.stat-ic.tone-slate{background:linear-gradient(135deg,#94a3b8,#475569);color:#fff}
.stat-ic{box-shadow:0 6px 14px rgba(15,23,42,.15)}
.auth,.auth-main,.auth-brand{background-repeat:no-repeat}
.auth::after{content:"";position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 150%22%3E%3Ccircle cx=%22196%22 cy=%2234%22 r=%2216%22 fill=%22%23fde68a%22/%3E%3Cellipse cx=%2260%22 cy=%2230%22 rx=%2222%22 ry=%228%22 fill=%22%23fff%22 opacity=%22.35%22/%3E%3Cellipse cx=%2276%22 cy=%2224%22 rx=%2214%22 ry=%227%22 fill=%22%23fff%22 opacity=%22.35%22/%3E%3Crect y=%22128%22 width=%22240%22 height=%2222%22 fill=%22%230b1d45%22 opacity=%22.35%22/%3E%3Crect x=%2270%22 y=%2262%22 width=%22100%22 height=%2268%22 rx=%223%22 fill=%22%23fff%22/%3E%3Cpath d=%22M62 64 120 32l58 32z%22 fill=%22%23f59e0b%22/%3E%3Crect x=%22110%22 y=%2294%22 width=%2220%22 height=%2236%22 rx=%223%22 fill=%22%232563eb%22/%3E%3Crect x=%2282%22 y=%2276%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Crect x=%22142%22 y=%2276%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Crect x=%2282%22 y=%22100%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Crect x=%22142%22 y=%22100%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Ccircle cx=%22120%22 cy=%2252%22 r=%226%22 fill=%22%232563eb%22/%3E%3Cpath d=%22M120 32V14%22 stroke=%22%23fff%22 stroke-width=%222%22/%3E%3Cpath d=%22M120 14h16l-4 5 4 5h-16z%22 fill=%22%23ef4444%22/%3E%3Ccircle cx=%2230%22 cy=%22112%22 r=%2216%22 fill=%22%2322c55e%22/%3E%3Crect x=%2228%22 y=%22120%22 width=%224%22 height=%2212%22 fill=%22%2392400e%22/%3E%3Ccircle cx=%22212%22 cy=%22116%22 r=%2212%22 fill=%22%2316a34a%22/%3E%3Crect x=%22210%22 y=%22122%22 width=%224%22 height=%2210%22 fill=%22%2392400e%22/%3E%3C/svg%3E") center bottom/auto 150px repeat-x;opacity:.55}
.auth-card{position:relative;z-index:1}

/* =====================================================================
   PREMIUM THEME v2 — visual layer only (same class names, same markup)
   ===================================================================== */
:root{
  --purple:#7c3aed; --purple-l:#f1eaff; --teal:#0d9488; --teal-l:#dcf6f2; --pink:#db2777; --pink-l:#fde7f1;
  --grad:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%); --grad-soft:linear-gradient(135deg,#eaf1ff 0%,#f1eaff 100%);
  --bg:#f3f5fc; --line:#e7ebf6; --radius:16px;
  --shadow:0 1px 2px rgba(20,30,90,.04),0 10px 30px rgba(31,41,120,.07);
  --shadow-lg:0 18px 44px rgba(31,41,120,.16);
  --ease:cubic-bezier(.22,.8,.3,1);
}
body{background:radial-gradient(900px 380px at 85% -8%,rgba(124,58,237,.09),transparent 70%),radial-gradient(700px 320px at 0% 0%,rgba(37,99,235,.07),transparent 70%),var(--bg);background-attachment:fixed}
::selection{background:rgba(124,58,237,.22)}
*{scrollbar-width:thin;scrollbar-color:#c7cfe8 transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c7cfe8;border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* ---- sidebar ---- */
.sidebar{background:linear-gradient(185deg,#0a1642 0%,#14286e 52%,#2b1e7c 100%);box-shadow:6px 0 30px rgba(10,22,66,.25)}
.sidebar::after{content:"";position:absolute;inset:auto 0 0 0;height:180px;pointer-events:none;background:radial-gradient(160px 120px at 20% 100%,rgba(167,139,250,.28),transparent 70%)}
.sidebar .brand{gap:11px;border-bottom:1px solid rgba(255,255,255,.1);padding:0 18px}
.brand-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand-t b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-t small{font-size:11px;font-weight:500;color:#a9b8e6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar nav{padding:16px 12px;gap:4px;position:relative;z-index:1}
.nav-item{padding:11px 13px;border-radius:12px;color:#c4d0f3;transition:background .2s var(--ease),color .2s,transform .2s var(--ease)}
.nav-item .ic{opacity:.85;transition:transform .2s var(--ease)}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateX(3px)}
.nav-item:hover .ic{transform:scale(1.1)}
.nav-item.active{background:linear-gradient(135deg,rgba(96,165,250,.34),rgba(167,139,250,.34));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 6px 16px rgba(10,22,66,.3)}
.nav-item.active .ic{opacity:1}
.nav-item.active::before{left:-12px;width:4px;background:linear-gradient(180deg,#93c5fd,#c4b5fd)}
.side-foot{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.1);color:#9fb0e2}

/* ---- top bar ---- */
.topbar{background:rgba(255,255,255,.85);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid rgba(231,235,246,.9);box-shadow:0 4px 20px rgba(31,41,120,.04)}
.topbar .title{font-size:17px;letter-spacing:-.01em}
.icon-btn{border-radius:11px;transition:background .15s,color .15s,transform .15s var(--ease)}
.icon-btn:hover{transform:translateY(-1px)}
.gsearch .search input{background:#f4f6fd;border-color:transparent;border-radius:12px}
.gsearch .search input:focus{background:#fff}
.menu,.pop{border-radius:16px;box-shadow:var(--shadow-lg);border-color:var(--line);animation:rise .18s var(--ease)}

/* ---- page ---- */
.view{padding:26px 26px 40px}
.page-head h1{font-size:24px;letter-spacing:-.02em}
.page-head p{font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view>*{animation:rise .42s var(--ease) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- buttons ---- */
.btn{height:40px;border-radius:11px;padding:0 16px;border-color:#dfe4f3;box-shadow:0 1px 2px rgba(20,30,90,.04);transition:transform .15s var(--ease),box-shadow .15s,background .15s,border-color .15s}
.btn:hover{background:#f6f8ff;border-color:#cdd5ee;transform:translateY(-1px);box-shadow:0 6px 16px rgba(31,41,120,.1)}
.btn:active{transform:none}
.btn-primary{background:var(--grad);border-color:transparent;box-shadow:0 8px 20px rgba(79,70,229,.32)}
.btn-primary:hover{background:var(--grad);filter:brightness(1.07);border-color:transparent;box-shadow:0 10px 24px rgba(79,70,229,.4)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#be123c);border-color:transparent;box-shadow:0 8px 18px rgba(220,38,38,.28)}
.btn-danger:hover{background:linear-gradient(135deg,#ef4444,#be123c);filter:brightness(1.06)}
.btn-danger-o{color:var(--red);border-color:#f3c3c3;background:#fff}.btn-danger-o:hover{background:var(--red-l)!important}
.btn-sm{height:32px;border-radius:9px}
.btn:focus-visible,.icon-btn:focus-visible,.nav-item:focus-visible,.tab:focus-visible{outline:3px solid rgba(124,58,237,.35);outline-offset:2px}

/* ---- cards & stats ---- */
.card{border-radius:var(--radius);border-color:var(--line);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.card-head{padding:17px 20px;border-bottom-color:var(--line)}
.card-head h3{font-size:15.5px;display:flex;align-items:center;gap:8px}
.card-head h3::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--grad)}
.card-head .small{font-weight:600}
.stats{gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px 20px;border-color:var(--line);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--grad-soft);opacity:.7;transition:transform .35s var(--ease)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}.stat:hover::after{transform:scale(1.3)}
.stat>*{position:relative;z-index:1}
.stat-ic{width:50px;height:50px;border-radius:15px;color:#fff;box-shadow:0 8px 18px rgba(31,41,120,.22)}
.stat-ic.tone-blue{background:linear-gradient(135deg,#60a5fa,#1d4ed8)}.stat-ic.tone-green{background:linear-gradient(135deg,#34d399,#047857)}
.stat-ic.tone-red{background:linear-gradient(135deg,#fb7185,#be123c)}.stat-ic.tone-amber{background:linear-gradient(135deg,#fbbf24,#d97706)}
.stat-ic.tone-slate{background:linear-gradient(135deg,#94a3b8,#475569)}
.stat-ic.tone-purple{background:linear-gradient(135deg,#a78bfa,#6d28d9)}.stat-ic.tone-teal{background:linear-gradient(135deg,#2dd4bf,#0f766e)}.stat-ic.tone-pink{background:linear-gradient(135deg,#f472b6,#be185d)}
.tone-purple{background:var(--purple-l);color:var(--purple)}.tone-teal{background:var(--teal-l);color:var(--teal)}.tone-pink{background:var(--pink-l);color:var(--pink)}
.stat-v{font-size:23px;letter-spacing:-.03em;white-space:nowrap}.stat>div:last-child{min-width:0}.stat-l{overflow-wrap:anywhere}
.stat-l{font-size:12.5px}

/* ---- hero ---- */
.hero{border-radius:24px;padding:24px 26px;margin-bottom:20px;background:linear-gradient(120deg,#0a1642 0%,#1d4ed8 52%,#7c3aed 100%);box-shadow:0 18px 44px rgba(67,56,202,.32)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 90% 0%,rgba(255,255,255,.18),transparent 70%),radial-gradient(300px 200px at 0% 110%,rgba(167,139,250,.35),transparent 70%);pointer-events:none}
.hero>.hero-art{width:300px;right:10px;opacity:.95}
.hero h2{font-size:28px;letter-spacing:-.02em}
.hero p{font-size:14.5px}
.hero-top b{font-size:16px}
.hero-ref{margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:11px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease)}
.hero-ref:hover{transform:rotate(90deg)}
.hero-chips{gap:10px}
.hero-chip{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:14px;padding:10px 15px;transition:transform .2s var(--ease),background .2s}
.hero-chip:hover{transform:translateY(-2px);background:rgba(255,255,255,.22)}
.hero-chip b{font-size:21px}
.hero-btn{border-radius:12px;padding:9px 15px;transition:transform .15s var(--ease),box-shadow .15s}
.hero-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.2)}
.hero-btn:not(.ghost){color:#4338ca}

/* ---- dashboard widgets ---- */
.donut{display:block;flex:none}.donut-c{font-size:27px;font-weight:800;fill:var(--ink);letter-spacing:-.03em}.donut-s{font-size:9.5px;fill:var(--ink2);font-weight:600}
.att-ov{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.att-donut{display:flex;flex-direction:column;align-items:center;gap:12px}
.legend.col{flex-direction:column;gap:7px;font-size:12.5px}.legend.col b{color:var(--ink);margin-left:4px}
.bars.short{height:150px}
.bars.money{height:170px;gap:12px}
.bar-val{font-size:10.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;min-height:14px}
.bar-stack{border-radius:9px 9px 0 0;transition:transform .2s var(--ease),filter .2s}
.bar-col:hover .bar-stack{filter:brightness(1.1);transform:scaleX(1.06)}
.bar-stack.grad{background:linear-gradient(180deg,#8b5cf6,#2563eb);max-width:44px}
.c-present{--c:#2563eb;background:linear-gradient(180deg,#60a5fa,#2563eb)}.c-absent{--c:#ef4444;background:linear-gradient(180deg,#fb7185,#ef4444)}
.gender-row{display:flex;align-items:center;gap:20px}
.hbar .fill{background:linear-gradient(90deg,#60a5fa,#7c3aed);border-radius:6px}
.hbar .track{height:10px}
.fee-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fee-kpis>div{background:var(--grad-soft);border-radius:14px;padding:12px 14px;min-width:0}
.fee-kpis small{display:block;font-size:11px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.fee-kpis b{display:block;font-size:17px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.fee-kpis b.neg{color:var(--red)}
.ev{display:flex;gap:13px;align-items:center;padding:12px 20px;color:var(--ink);border-bottom:1px solid var(--line);transition:background .15s}
.ev:last-child{border-bottom:0}.ev:hover{background:#f7f8ff}
.ev-date{width:48px;height:52px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;text-transform:uppercase;flex:none;line-height:1.1}
.ev-date b{font-size:19px;letter-spacing:-.02em}
.ev-t{display:flex;flex-direction:column;min-width:0}.ev-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pay-amt{color:var(--green);font-size:13.5px;white-space:nowrap}
.notif{padding:11px 20px;border-radius:0;border-bottom:1px solid var(--line);transition:background .15s}
.notif:last-child{border-bottom:0}
.menu .notif,.pop .notif{border-bottom:0;border-radius:10px;padding:10px 12px}
.notif .ni{border-radius:10px;width:32px;height:32px}

/* ---- tables ---- */
.table-wrap{border-radius:0 0 var(--radius) var(--radius)}
.tbl th{background:linear-gradient(180deg,#f7f8ff,#f1f4fd);color:#5b6690;border-bottom:1px solid var(--line);padding:12px 18px}
.tbl td{padding:12px 18px;border-bottom-color:#eef1fa}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:#f6f8ff}
.badge{height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;gap:6px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-green{background:#e3f7ec;color:#047857}.b-red{background:#fde8ec;color:#be123c}.b-amber{background:#fff1d6;color:#b45309}.b-blue{background:#e4edff;color:#1d4ed8}
.chip{border-radius:8px;padding:3px 9px;background:#eef1fb;color:#4b5688;font-weight:500}.chip.alt{background:var(--purple-l);color:#6d28d9}

/* ---- avatars: professional placeholders ---- */
.avatar{background:var(--grad-soft);color:var(--blue-d);font-weight:700;box-shadow:0 0 0 2px #fff,0 3px 10px rgba(31,41,120,.14)}
.avatar.av-0{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff}.avatar.av-1{background:linear-gradient(135deg,#a78bfa,#6d28d9);color:#fff}
.avatar.av-2{background:linear-gradient(135deg,#2dd4bf,#0f766e);color:#fff}.avatar.av-3{background:linear-gradient(135deg,#f472b6,#be185d);color:#fff}
.avatar.av-4{background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff}.avatar.av-5{background:linear-gradient(135deg,#38bdf8,#4f46e5);color:#fff}
.avatar.xl{width:54px;height:54px;font-size:18px;border-radius:16px}
.avatar.lg{width:92px;height:92px;font-size:30px;border-radius:24px;box-shadow:0 0 0 3px #fff,0 10px 24px rgba(31,41,120,.22)}

/* ---- people cards ---- */
.stu-tools{align-items:center}
.view-seg{margin-right:auto}
.view-seg button{width:34px;height:28px;display:grid;place-items:center;padding:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:18px}
.pcard{position:relative;border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad);opacity:0;transition:opacity .25s}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#d9defa}.pcard:hover::before{opacity:1}
.pcard-top{display:flex;align-items:center;gap:12px}
.pcard-id{flex:1;min-width:0;display:flex;flex-direction:column}
.pcard-id b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.pcard-meta{display:grid;gap:7px;margin-top:14px;font-size:13px;color:var(--ink2)}
.pcard-meta>div{display:flex;gap:9px;align-items:center;min-width:0}.pcard-meta .ic{color:var(--purple);opacity:.85}
.pcard-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-act{display:flex;align-items:center;gap:4px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.grow{flex:1}

/* ---- tabs, filters, pager ---- */
.tabs{gap:6px;border-bottom:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.tab{border:0;border-radius:10px;padding:9px 16px;transition:background .2s,color .2s}
.tab:hover{background:#f3f5fd}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.seg{border-radius:11px;background:#eceffb}.seg button.on{color:var(--purple)}
.filters{padding:16px 20px;gap:12px}
.pager{padding:14px 20px}
.pill{background:#eef1fb;border-radius:12px}

/* ---- forms ---- */
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{height:40px;border-radius:11px;border-color:#dbe1f2;background:#fcfcff}
textarea{height:auto}
input:hover,select:hover,textarea:hover{border-color:#bfc9ea}
input:focus,select:focus,textarea:focus{border-color:#7c6cf0;box-shadow:0 0 0 4px rgba(124,58,237,.14);background:#fff}
.fg>label{color:#4b5688}
.section-title{color:#7c86b0}

/* ---- modals / toasts ---- */
.modal-backdrop{background:rgba(10,18,60,.55);backdrop-filter:blur(4px)}
.modal{border-radius:22px;box-shadow:0 30px 80px rgba(10,18,60,.4);animation:pop .25s var(--ease);overflow:hidden}
.modal-head{background:linear-gradient(180deg,#f7f8ff,#fff);padding:18px 24px;border-bottom-color:var(--line)}
.modal-head h3{font-size:18px;letter-spacing:-.01em}
.modal-body{padding:22px 24px}
.toast{border-radius:14px;box-shadow:0 14px 36px rgba(10,18,60,.35)}
.alert{border-radius:12px}

/* ---- empty & loading ---- */
.empty{padding:54px 20px}
.empty .ic{width:78px;height:78px;padding:20px;border-radius:50%;background:var(--grad-soft);color:var(--purple);margin-bottom:12px;box-shadow:0 10px 26px rgba(124,58,237,.14)}
.empty div{font-weight:500}
.empty-box{padding:22px;text-align:center;color:var(--ink2)}
.skel{height:16px;border-radius:9px;background:linear-gradient(90deg,#eceffb 25%,#f8f9ff 37%,#eceffb 63%);background-size:400% 100%}
.spinner{border-color:#e4e8fb;border-top-color:var(--purple)}

/* ---- login ---- */
.auth-brand{background:linear-gradient(150deg,#0a1642 0%,#1d3fae 55%,#6d28d9 100%);position:relative;overflow:hidden}
.auth-brand::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-100px;background:radial-gradient(circle,rgba(167,139,250,.55),transparent 70%)}
.auth-brand::after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;left:-120px;bottom:-140px;background:radial-gradient(circle,rgba(96,165,250,.45),transparent 70%)}
.auth-brand>*{position:relative;z-index:1}
.auth-card h2{letter-spacing:-.02em}
.logo-mark{background:var(--grad);box-shadow:0 8px 20px rgba(79,70,229,.4)}

/* ---- responsive ---- */
@media (max-width:1100px){.att-ov{grid-template-columns:1fr}.att-donut{flex-direction:row;justify-content:center;flex-wrap:wrap}}
@media (max-width:900px){
  .view{padding:16px 14px 90px}.page-head h1{font-size:21px}
  .sidebar{width:min(82vw,300px)}
  .hero{padding:18px;border-radius:20px}.hero h2{font-size:22px}.hero>.hero-art{width:190px;opacity:.35}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .stat{padding:14px;gap:11px}.stat-ic{width:42px;height:42px;border-radius:13px}.stat-v{font-size:21px}
  .stat::after{display:none}
  .stats>.stat:last-child:nth-child(odd){grid-column:1/-1}
}
@media (max-width:560px){
  .fee-kpis{grid-template-columns:1fr 1fr}.fee-kpis>div:last-child{grid-column:1/-1}
  .pgrid{grid-template-columns:1fr;padding:14px}
  .tabs{width:100%}.tab{padding:9px 13px}
  .gender-row{flex-wrap:wrap}.stat-v{font-size:19px}
  .modal-head{padding:16px 18px}.modal-body{padding:18px}
}

@media (max-width:1100px){.grid-main{grid-template-columns:1fr}}
@media (max-width:900px){
  .auth-wrap{grid-template-columns:1fr}.auth-brand{display:none}
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block}
  .main{margin-left:0}
  .hamburger{display:inline-grid}
  .topbar{padding:0 14px}.view{padding:16px 14px}
  .gsearch{display:none}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .form-grid,.kv{grid-template-columns:1fr}
  .modal-backdrop{padding:0;align-items:stretch}.modal{border-radius:0;min-height:100%;max-width:none!important}
  .topbar .title{font-size:15px;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
  .stats{grid-template-columns:1fr 1fr}.stat{padding:12px;gap:10px}.stat-ic{width:38px;height:38px}.stat-v{font-size:19px}
  .filters select,.search{width:100%;max-width:none;flex:1 1 100%}.filters input[type=date],.filters input[type=month]{flex:1 1 40%}
  .hbar{grid-template-columns:70px 1fr 34px}
}
.ft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:16px}
.ft-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ft-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#60a5fa,#1d4ed8)}
.ft-card.off{opacity:.7}.ft-card.off::before{background:#cbd5e1}
.ft-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ft-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.ft-name{font-size:17px;font-weight:700;margin-top:4px}
.ft-amount{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--blue-d)}.ft-amount small{font-size:13px;font-weight:600;color:var(--ink2)}
.ft-desc{color:var(--ink2);font-size:13px}.ft-used{color:var(--ink3);font-size:12px}
.ft-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-danger-o{color:var(--red);border-color:#f5b5b5}.btn-danger-o:hover{background:var(--red-l)}
.ft-help{display:flex;gap:8px;align-items:flex-start;background:var(--blue-l);color:#1e3a8a;border-radius:10px;padding:10px 12px;font-size:12.5px}
.grid2>*,.grid-main>*,.stats>*{min-width:0}.table-wrap{max-width:100%}
.pay-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.fee-kpi{margin-bottom:14px}
.logo-box{display:flex;gap:14px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:14px;margin-bottom:18px;flex-wrap:wrap}
.logo-prev{width:76px;height:76px;border-radius:16px;background:var(--slate-l);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--blue);flex:none}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.stu-tools{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
.imp-text{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.imp-sum{margin:10px 0 6px}.imp-tbl{max-height:260px;overflow:auto;margin-top:6px}
.imp-bad td{background:#fdecec}.imp-bad td:last-child{color:#b91c1c;font-size:12.5px}
.promo-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.promo .form-grid{grid-template-columns:1fr}
.empty-box{padding:18px;text-align:center;color:var(--muted,#64748b)}
@media(max-width:640px){.promo-cols{grid-template-columns:1fr}}
.id-sheet{display:grid;grid-template-columns:repeat(2,85.6mm);gap:6mm;justify-content:center}
.idc{width:85.6mm;height:54mm;border:.3mm solid var(--blue,#2563eb);border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid;background:#fff;color:#0f172a}
.idc-h{background:var(--blue,#2563eb);color:#fff;padding:1.6mm 3mm;display:flex;align-items:center;gap:2mm;font-weight:700;font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.idc-h img{width:8mm;height:8mm;object-fit:contain;background:#fff;border-radius:1.5mm}
.idc-b{flex:1;display:flex;gap:3mm;padding:2.5mm 3mm}
.idc-ph{width:22mm;height:28mm;border:.2mm solid #cbd5e1;border-radius:1.5mm;object-fit:cover;background:#eef1f6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16pt;color:var(--blue,#2563eb);flex:none}
.idc-i{font-size:8pt;line-height:1.4;min-width:0}.idc-i b{font-size:10pt;display:block;word-break:break-word;margin-bottom:1mm}
.idc-f{font-size:6.5pt;color:#475569;padding:1mm 3mm;border-top:.2mm solid #e5e9f2;text-align:center}

.auth-brand::before,.auth-brand::after{display:none}
.auth::after{display:none}
@media(min-width:901px){.auth-brand{justify-content:flex-start}.auth-brand>:nth-child(2){margin-top:auto;margin-bottom:34px}}
@media(max-width:900px){
  #auth{background:#0a1642 var(--login-photo) 45% 0/cover no-repeat}
  .auth-side{place-items:end center;padding-bottom:22px}
  .auth-side{background:linear-gradient(180deg,rgba(10,22,66,.55),rgba(10,22,66,.85))}
  .auth-card{background:rgba(255,255,255,.96);padding:24px 20px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
}

/* ---- login: no white panel, form sits on the dark photo theme ---- */
.auth-side{background:linear-gradient(160deg,#0a1642 0%,#10286b 60%,#2a1a6e 100%)!important}
.auth-card{background:transparent!important;box-shadow:none!important;color:#fff}
.auth-card h2,.auth-card label,.auth-card .logo,.auth-card .logo span,.auth-card b{color:#fff!important}
.auth-card p,.auth-card .muted,.auth-card small{color:#c7d6f5!important}
.auth-card input,.auth-card select{background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff!important}
.auth-card input::placeholder{color:rgba(255,255,255,.55)}
.auth-card input:focus{border-color:#a78bfa!important;box-shadow:0 0 0 3px rgba(167,139,250,.3)!important}
.auth-card a,.auth-card .link{color:#bcd0ff!important}
.auth-lang .seg,.auth-lang>*{box-shadow:none}
@media(max-width:900px){
  .auth-side{background:linear-gradient(180deg,rgba(10,22,66,0) 0%,rgba(10,22,66,.8) 40%,rgba(10,22,66,.96) 100%)!important}
  .auth-card{padding:24px 6px!important;border-radius:0!important}
}
.auth-card .btn:not(.btn-primary){background:rgba(255,255,255,.12)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important}
</style>

function errMsg(e) {
  const m = (e && e.message) || String(e), c = e && e.code;

  if (c === '23503') return t('err_fk');
  if (c === '42501' || /row-level security|permission denied/i.test(m)) return t('err_denied');
  if (c === '23514') return t('err_check') + ' ' + (e.details || '');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return t('err_network');
  if (/Invalid login credentials/i.test(m)) return t('err_login');
  return m;
}

/* Read every page of a query (PostgREST returns max 1000 rows per request) */
async function fetchAll(build, size = 1000) {
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + size - 1);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < size) break;
    from += size;
  }
  return out;
}

/* ---- form field builder:  f = {k, l(i18n key), type, req, opts:[{v,l}], full, min, max, step, ph, help, def, ro} ---- */
function field(f, v) {
  if (f.sep) return `<div class="section-title">${esc(t(f.sep))}</div>`;
  const val = v ?? f.def ?? '';
  const id = 'f_' + f.k;
  const common = `id="${id}" name="${f.k}" ${f.req ? 'required' : ''} ${f.ro ? 'disabled' : ''}`;
  let input;
  if (f.type === 'select') {
    const opts = (f.opts || []).map(o => `<option value="${esc(o.v)}" ${String(val) === String(o.v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('');
    input = `<select ${common}><option value="">${esc(f.blank || t('select_opt'))}</option>${opts}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea ${common} placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  } else if (f.type === 'checkbox') {
    return `<div class="fg ${f.full ? 'full' : ''}"><label class="check"><input type="checkbox" ${common} ${val ? 'checked' : ''}> <span>${esc(t(f.l))}</span></label>${f.help ? `<span class="help">${esc(t(f.help))}</span>` : ''}</div>`;
  } else {
    input = `<input type="${f.type || 'text'}" ${common} value="${esc(val)}" placeholder="${esc(f.ph || '')}"
      ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step ? `step="${f.step}"` : ''} ${f.maxlength ? `maxlength="${f.maxlength}"` : ''} ${f.type === 'number' ? 'inputmode="decimal"' : ''}>`;
  }
  return `<div class="fg ${f.full ? 'full' : ''}"><label for="${id}">${esc(t(f.l))}${f.req ? ' <span class="req">*</span>' : ''}</label>${input}${f.help ? `<span class="help">${esc(t(f.help))}</span>` : ''}</div>`;
}
function readForm(form, fields) {
  const o = {};
  fields.forEach(f => {
    if (f.ro || f.skip || f.sep) return;
    const el = form.elements[f.k]; if (!el) return;
    if (f.type === 'checkbox') { o[f.k] = el.checked; return; }
    let v = (el.value ?? '').trim();
    if (v === '') { o[f.k] = null; return; }
    o[f.k] = f.type === 'number' ? Number(v) : v;
  });
  return o;
}
/* Modal with a generated form. onSubmit(values, form, modalEl) may throw; return false to keep it open. */
function formModal({ title, fields, values = {}, submitLabel, extra = '', extraTop = '', size = '', onSubmit, onMount }) {
  const body = `<form class="form-grid" autocomplete="off">${extraTop}${fields.map(f => field(f, values[f.k])).join('')}${extra}
    <div class="modal-foot"><button type="button" class="btn" data-act="modal-close">${t('cancel')}</button>
    <button type="submit" class="btn btn-primary">${esc(submitLabel || t('save'))}</button></div></form>`;
  const el = modal({ title, body, size });
  const form = $('form', el);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    await withBusy($('[type=submit]', form), async () => {
      try { const r = await onSubmit(readForm(form, fields), form, el); if (r !== false) closeModal(el); }
      catch (err) { handleErr(err); }
    });
  });
  if (onMount) onMount(el, form);
  return el;
}

function pager(el, { total, page, size = PAGE_SIZE, onPage }) {

/* ---- filter bar: defs = [{k,type:'search'|'select'|'date'|'month',ph,blank,opts:()=>[],reset:[keys],rerender}] ---- */

  const draw = () => {
    host.innerHTML = `<div class="filters">${defs.map(d => {
      if (d.type === 'select') return `<select data-k="${d.k}" aria-label="${esc(d.blank || '')}"><option value="">${esc(d.blank || t('all'))}</option>${d.opts().map(o => `<option value="${esc(o.v)}" ${String(st[d.k]) === String(o.v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
      if (d.type === 'date' || d.type === 'month') return `<input type="${d.type}" data-k="${d.k}" value="${esc(st[d.k])}" aria-label="${esc(d.ph || '')}" title="${esc(d.ph || '')}" ${d.max ? `max="${d.max}"` : ''}>`;
      return `<div class="search">${ic('search', 16)}<input type="search" data-k="${d.k}" placeholder="${esc(d.ph || t('search'))}" value="${esc(st[d.k])}"></div>`;
    }).join('')}</div>`;
    $$('[data-k]', host).forEach(inp => {
      const d = defs.find(x => x.k === inp.dataset.k);
      const h = async () => { st[d.k] = inp.value; if ('page' in st) st.page = 1; (d.reset || []).forEach(k => st[k] = ''); const r = onChange(d.k); if (d.wait) await r; if (d.rerender || d.reset) draw(); };
      if (inp.type === 'search') inp.addEventListener('input', debounce(h, 300)); else inp.addEventListener('change', h);

}

function toCSV(cols, rows) {
  const q = v => { v = v ?? ''; v = String(v); return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.map(c => q(c.l)).join(','), ...rows.map(r => cols.map(c => q(r[c.k])).join(','))].join('\r\n');
}
function downloadCSV(name, cols, rows) {

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `${name}-${todayStr()}.csv`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function resizeImage(file, max = 480) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('Image error')), 'image/jpeg', .85); };
    img.onerror = () => rej(new Error(t('err_image'))); img.src = url;

/* Compute class results for a term (used by results tab, report cards, reports) */
async function classResults(classId, termId) {
  const sid = S.school.id, term = byId(S.terms, termId);
  const ass = ok(await sb.from('assessments').select('id,subject_id,max_marks,name').eq('school_id', sid).eq('class_id', classId).eq('term_id', termId)).data || [];
  const subjIds = uniq(ass.map(a => a.subject_id));
  const subjects = subjIds.map(id => byId(S.subjects, id)).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  const roster = await fetchAll(() => sb.from('enrollments').select('student_id,section_id,students(full_name,admission_no,status)').eq('school_id', sid).eq('class_id', classId).eq('academic_year_id', term.academic_year_id).order('student_id'));
  let marks = [];
  if (ass.length) for (const ids of chunk(ass.map(a => a.id), 60)) marks = marks.concat(await fetchAll(() => sb.from('marks').select('student_id,assessment_id,score').in('assessment_id', ids).order('id')));
  const aMap = Object.fromEntries(ass.map(a => [a.id, a]));
  const rows = roster.filter(r => r.students).map(r => ({ id: r.student_id, name: r.students.full_name, adm: r.students.admission_no, section_id: r.section_id, subj: {}, total: 0, max: 0 }));
  const rMap = Object.fromEntries(rows.map(r => [r.id, r]));
  marks.forEach(m => { const r = rMap[m.student_id], a = aMap[m.assessment_id]; if (!r || !a) return;
    const s = r.subj[a.subject_id] ||= { score: 0, max: 0 }; s.score += +m.score; s.max += +a.max_marks; r.total += +m.score; r.max += +a.max_marks; });
  rows.forEach(r => { const ps = Object.values(r.subj).filter(s => s.max > 0).map(s => s.score / s.max * 100);
    r.pct = pct(r.total, r.max); r.avg = ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length * 10) / 10 : 0; r.grade = r.max ? gradeOf(r.pct) : '—'; });
  const ranked = rows.filter(r => r.max > 0).sort((a, b) => b.pct - a.pct);
  ranked.forEach((r, i) => r.rank = i && r.pct === ranked[i - 1].pct ? ranked[i - 1].rank : i + 1);
  rows.sort((a, b) => (a.rank || 9999) - (b.rank || 9999) || a.name.localeCompare(b.name));
  return { subjects, rows, ranked: ranked.length, term, classId };
}

/* Loads profile, membership, school, permissions and lookups after login */
async function loadContext() {
  const uid = S.user.id;
  const prof = (await sb.from('profiles').select('*').eq('id', uid).maybeSingle()).data;
  S.profile = prof || { id: uid, full_name: S.user.email, email: S.user.email };
  const mems = ok(await sb.from('school_members').select('*, schools(*)').eq('user_id', uid)).data || [];
  S.memberships = mems.filter(m => m.status === 'active' && m.schools);
  if (!S.memberships.length) throw Object.assign(new Error(t('no_membership')), { noAccess: true });
  let saved = null; try { saved = localStorage.getItem('sms_school'); } catch (e) {}
  S.member = S.memberships.find(m => m.school_id === saved) || S.memberships[0];
  await selectSchool(S.member);
}
async function selectSchool(m) {
  S.member = m; S.school = m.schools; S.role = m.role;
  // teachers use the dedicated Teacher Portal (same login, same repo)
  if (m.role === 'teacher' && !/[?&]admin=1/.test(location.search)) { location.replace('teacher_portal.html'); return new Promise(() => { }); }
  try { localStorage.setItem('sms_school', m.school_id); } catch (e) {}
  const p = ok(await sb.rpc('my_permissions', { p_school: S.school.id })).data || [];
  S.perms = new Set(p);
  if (!S.perms.size) {
    const sc = S.school || {}, ended = sc.subscription_ends_at && new Date(sc.subscription_ends_at) <= new Date();
    const msg = sc.status === 'suspended' ? t('school_suspended') : (sc.status === 'expired' || ended) ? t('school_expired') : t('school_inactive');
    throw Object.assign(new Error(msg), { noAccess: true });
  }
  await loadLookups(); await loadTeacherCtx();
  S.stats = null;
}

async function start(session) {
  if (starting) return; starting = true;
  try {
    if (!session) { S.user = null; showAuth('login'); return; }
    S.user = session.user;
    await loadContext();
    renderShell(); show('app');
    if (!location.hash.startsWith('#/')) location.hash = '#/dashboard';
    await route(); refreshStats();
  } catch (e) {
    console.error(e);
    if (e.noAccess) showAuth('noaccess', e.message); else { showAuth('noaccess', errMsg(e)); }
  } finally { starting = false; }
}

const donut = (segs, { size = 150, stroke = 17, center = '', sub = '' } = {}) => {
  const tot = segs.reduce((a, s) => a + s.v, 0), r = (size - stroke) / 2, C = 2 * Math.PI * r, h = size / 2; let off = 0;
  const arcs = tot ? segs.filter(s => s.v > 0).map(s => { const len = s.v / tot * C, el = `<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${h} ${h})"/>`; off += len; return el; }).join('') : '';
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="#eaeef7" stroke-width="${stroke}"/>${arcs}
    <text x="50%" y="${sub ? '47%' : '53%'}" text-anchor="middle" class="donut-c">${esc(center)}</text>${sub ? `<text x="50%" y="63%" text-anchor="middle" class="donut-s">${esc(sub)}</text>` : ''}</svg>`;
};
const compact = n => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(n)); };

  monthly: { month: todayStr().slice(0, 7), cls: '', sec: '' }, hist: null, histFrom: addDays(todayStr(), -90), histTo: todayStr() };
TABSTATE.attendance = ATT;

async function renderAttendance() {
  const tabs = [...(can('attendance.write') ? [{ id: 'take', label: t('take_attendance') }] : []), { id: 'daily', label: t('daily_report') }, { id: 'monthly', label: t('monthly_report') }, { id: 'history', label: t('student_history') }];

  $('#view').innerHTML = pageHead(t('nav_attendance'), t('attendance_sub')) + tabsBar(tabs, ATT.tab) + `<div class="card" id="att-body"></div>`;

const statusRadios = (name, val, dis) => `<div class="att-status">${ATT_STATUS.map(s => `<label><input type="radio" name="${name}" value="${s}" ${val === s ? 'checked' : ''} ${dis ? 'disabled' : ''}><span class="s-${s}">${t('st_' + s)}</span></label>`).join('')}</div>`;

/* ---- take attendance ---- */
function viewTake(body) {
  const st = ATT.take;
  body.innerHTML = `<div id="att-filters"></div><div id="att-roster"></div>`;
  filterBar($('#att-filters', body), [
    { k: 'cls', type: 'select', blank: t('select_class'), opts: classOpts, reset: ['sec'] },
    { k: 'sec', type: 'select', blank: t('select_section'), opts: () => sectionOpts(st.cls) },
    { k: 'date', type: 'date', ph: t('date'), max: todayStr() }], st, loadRoster);
  loadRoster();
}
async function loadRoster() {
  const st = ATT.take, box = $('#att-roster'); if (!box) return;
  if (!st.cls || !st.sec || !st.date) { box.innerHTML = emptyState(isTeacher() && !allowedClasses().length ? t('n_no_assign') : t('pick_class_section'), 'calendar'); return; }
  if (!S.curYear) { box.innerHTML = emptyState(t('need_setup')); return; }
  if (st.date > todayStr()) { box.innerHTML = emptyState(t('future_date')); return; }
  box.innerHTML = skeleton();
  const sid = S.school.id;
  const [enr, ses] = await Promise.all([
    sb.from('enrollments').select('student_id, students(id,full_name,admission_no,status)').eq('school_id', sid).eq('section_id', st.sec).eq('academic_year_id', S.curYear.id),
    sb.from('attendance_sessions').select('id, attendance_records(student_id,status,note)').eq('section_id', st.sec).eq('session_date', st.date).maybeSingle()]);
  ok(enr); ok(ses);
  const existing = Object.fromEntries((ses.data?.attendance_records || []).map(r => [r.student_id, r]));
  const rows = (enr.data || []).map(e => e.students).filter(s => s && (s.status === 'active' || existing[s.id])).sort((a, b) => a.full_name.localeCompare(b.full_name));
  const locked = st.date < addDays(todayStr(), -1) && !can('attendance.edit_past');
  if (!rows.length) { box.innerHTML = emptyState(t('no_students_in_section')); return; }
  box.innerHTML = `${ses.data ? `<div class="alert warn" style="margin:14px 18px 0">${t('att_exists')}</div>` : ''}${locked ? `<div class="alert err" style="margin:14px 18px 0">${t('att_locked')}</div>` : ''}
    <div class="summary-row" id="att-sum"></div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>${t('student')}</th><th>${t('status')}</th><th>${t('note')}</th></tr></thead><tbody>
    ${rows.map((s, i) => `<tr data-sid="${s.id}"><td>${i + 1}</td><td><div class="cell-user">${avatar(s.full_name)}<div><b>${esc(s.full_name)}</b><span class="muted small">${esc(s.admission_no)}</span></div></div></td>
      <td>${statusRadios('s_' + s.id, existing[s.id]?.status || 'present', locked)}</td>
      <td><input type="text" class="att-note" maxlength="200" value="${esc(existing[s.id]?.note || '')}" ${locked ? 'disabled' : ''} aria-label="${t('note')}"></td></tr>`).join('')}</tbody></table></div>
    <div class="sticky-foot">${locked ? '' : `<button class="btn" data-act="att-all" data-s="present">${t('mark_all_present')}</button><button class="btn" data-act="att-all" data-s="absent">${t('mark_all_absent')}</button><button class="btn btn-primary" data-act="att-save">${ic('check', 16)} ${t('save_attendance')}</button>`}</div>`;
  const sum = () => { const c = Object.fromEntries(ATT_STATUS.map(s => [s, 0])); $$('#att-roster tbody tr').forEach(tr => { const r = $('input:checked', tr); if (r) c[r.value]++; });
    $('#att-sum').innerHTML = `<span class="pill">${t('total')}: ${rows.length}</span>` + ATT_STATUS.map(s => `<span class="pill"><span class="c-${s}" style="display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px"></span>${t('st_' + s)}: ${c[s]}</span>`).join(''); };
  sum(); $('#att-roster tbody').addEventListener('change', sum);
}
ACT['att-all'] = el => { $$('#att-roster tbody tr').forEach(tr => { const r = $(`input[value="${el.dataset.s}"]`, tr); if (r && !r.disabled) r.checked = true; }); $('#att-roster tbody').dispatchEvent(new Event('change')); };
ACT['att-save'] = async el => withBusy(el, async () => {
  const st = ATT.take, sid = S.school.id;
  const rows = $$('#att-roster tbody tr').map(tr => ({ student_id: tr.dataset.sid, status: $('input:checked', tr)?.value, note: $('.att-note', tr).value.trim() || null }));
  if (rows.some(r => !r.status)) return toast(t('mark_all_first'), 'error');
  const s = ok(await sb.from('attendance_sessions').upsert({ school_id: sid, section_id: st.sec, session_date: st.date, taken_by: S.user.id }, { onConflict: 'section_id,session_date' }).select('id').single()).data;
  ok(await sb.from('attendance_records').upsert(rows.map(r => ({ ...r, school_id: sid, session_id: s.id, marked_by: S.user.id })), { onConflict: 'session_id,student_id' }));
  toast(t('attendance_saved')); refreshStats(); loadRoster();
});

/* ---- daily report ---- */
function viewDaily(body) {
  const st = ATT.daily;
  body.innerHTML = `<div id="d-filters"></div><div id="d-out"></div>`;
  filterBar($('#d-filters', body), [{ k: 'date', type: 'date', ph: t('date'), max: todayStr() },
    { k: 'cls', type: 'select', blank: t('all_classes'), opts: classOpts, reset: ['sec'] },
    { k: 'sec', type: 'select', blank: t('all_sections'), opts: () => sectionOpts(st.cls) }], st, loadDaily);
  loadDaily();
}
async function loadDaily() {
  const st = ATT.daily, box = $('#d-out'); if (!box) return; box.innerHTML = skeleton();
  let q = sb.from('attendance_sessions').select('id,section_id,session_date, attendance_records(status,note,students(full_name,admission_no))').eq('school_id', S.school.id).eq('session_date', st.date);
  if (st.sec) q = q.eq('section_id', st.sec); else if (st.cls) q = q.in('section_id', sectionsOf(st.cls).map(s => s.id));
  const { data, error } = await q; if (error) { box.innerHTML = `<div class="card-pad"><div class="alert err">${esc(errMsg(error))}</div></div>`; return; }
  const secs = data.sort((a, b) => classLabel(S.sections.find(x => x.id === a.section_id)?.class_id, a.section_id).localeCompare(classLabel(S.sections.find(x => x.id === b.section_id)?.class_id, b.section_id), undefined, { numeric: true }));
  const flat = []; const cnt = Object.fromEntries(ATT_STATUS.map(s => [s, 0]));
  secs.forEach(s => { const sec = byId(S.sections, s.section_id); (s.attendance_records || []).forEach(r => { cnt[r.status]++; flat.push({ date: st.date, class_section: classLabel(sec?.class_id, s.section_id), admission_no: r.students?.admission_no, full_name: r.students?.full_name, status: t('st_' + r.status), _s: r.status, note: r.note || '' }); }); });
  flat.sort((a, b) => a.class_section.localeCompare(b.class_section, undefined, { numeric: true }) || (a.full_name || '').localeCompare(b.full_name || ''));
  const total = flat.length;
  const pending = !isTeacher() && !st.sec && can('attendance.write') ? S.sections.filter(x => (!st.cls || x.class_id === st.cls) && !data.some(d => d.section_id === x.id)) : [];
  DAILY_CACHE = flat;
  box.innerHTML = `<div class="summary-row"><span class="pill">${t('total')}: ${total}</span>${ATT_STATUS.map(s => `<span class="pill">${t('st_' + s)}: ${cnt[s]}</span>`).join('')}<span class="pill">${t('attendance_rate')}: ${total ? pct(cnt.present + cnt.late, total) : 0}%</span>
    <span style="flex:1"></span><button class="btn btn-sm" data-act="daily-csv">${ic('download', 14)} CSV</button><button class="btn btn-sm" data-act="daily-print">${ic('printer', 14)} ${t('print')}</button></div>
    ${pending.length ? `<div class="alert warn" style="margin:14px 18px 0">${t('sections_pending')}: ${pending.slice(0, 20).map(x => esc(classLabel(x.class_id, x.id))).join(', ')}${pending.length > 20 ? '…' : ''}</div>` : ''}
    ${total ? `<div class="table-wrap">${tableHTML([{ k: 'class_section', l: t('class_section') }, { k: 'admission_no', l: t('admission_no') }, { k: 'full_name', l: t('student') }, { k: 'badge', l: t('status'), html: true }, { k: 'note', l: t('note') }], flat.map(r => ({ ...r, badge: badge(r._s) })))}</div>` : emptyState(t('no_attendance_day'))}`;
}
let DAILY_CACHE = [];
const DAILY_COLS = () => [{ k: 'date', l: t('date') }, { k: 'class_section', l: t('class_section') }, { k: 'admission_no', l: t('admission_no') }, { k: 'full_name', l: t('student') }, { k: 'status', l: t('status') }, { k: 'note', l: t('note') }];
ACT['daily-csv'] = () => downloadCSV('attendance-daily', DAILY_COLS(), DAILY_CACHE);
ACT['daily-print'] = () => printDoc(`<div class="sheet">${letterhead(t('daily_report'), fmtDate(ATT.daily.date))}${tableHTML(DAILY_COLS().slice(1), DAILY_CACHE)}</div>`, t('daily_report'));

/* ---- monthly report ---- */
function viewMonthly(body) {
  const st = ATT.monthly;
  body.innerHTML = `<div id="m-filters"></div><div id="m-out"></div>`;
  filterBar($('#m-filters', body), [{ k: 'month', type: 'month', ph: t('month'), max: todayStr().slice(0, 7) },
    { k: 'cls', type: 'select', blank: t('all_classes'), opts: classOpts, reset: ['sec'] },
    { k: 'sec', type: 'select', blank: t('all_sections'), opts: () => sectionOpts(st.cls) }], st, loadMonthly);
  loadMonthly();
}
let MONTHLY_CACHE = [];
async function loadMonthly() {
  const st = ATT.monthly, box = $('#m-out'); if (!box) return;
  if (!st.month) { box.innerHTML = emptyState(t('pick_month')); return; }
  box.innerHTML = skeleton(); const [from, to] = monthRange(st.month);
