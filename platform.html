<title>Platform Console</title>

<style>
:root{--bg:#f3f5fb;--surface:#fff;--surface2:#f8f9fe;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--line:#e4e8f3;--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#eaf1ff;--violet:#7c3aed;--navy:#0b1544;--green:#15803d;--green-l:#e3f6ea;--red:#dc2626;--red-l:#fdecec;--amber:#b45309;--amber-l:#fff3dc;--slate-l:#eef1f7;--radius:16px;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 28px rgba(30,41,90,.07);--grad:linear-gradient(135deg,#2563eb,#7c3aed);--side:264px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
:root[data-theme=dark]{--bg:#0a1030;--surface:#121a42;--surface2:#0f1638;--ink:#e8ecfb;--ink2:#a9b4da;--ink3:#6c78a8;--line:#222c5c;--blue:#5b8cff;--blue-d:#7aa2ff;--blue-l:#1b2a66;--green:#4ade80;--green-l:#12351f;--red:#f87171;--red-l:#3b1520;--amber:#fbbf24;--amber-l:#3a2a0c;--slate-l:#1a2352;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
h1,h2,h3,h4{margin:0}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:var(--side);background:linear-gradient(185deg,#0b1544 0%,#16276f 55%,#2b1a73 100%);color:#dfe6ff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px}
.brand .lg{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.45)}
.brand b{font-size:15px;color:#fff;display:block;line-height:1.2}.brand span{font-size:11.5px;opacity:.7}
.nav{flex:1;overflow-y:auto;padding:6px 10px 16px}
.nav h6{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.5;margin:16px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#cfd8ff;text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,transform .15s;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:linear-gradient(90deg,rgba(91,140,255,.35),rgba(124,58,237,.3));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.nav a .bd{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.main{flex:1;margin-left:var(--side);min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .ttl{font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);position:relative;transition:transform .15s,box-shadow .15s}
.ib:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.ib .dt{position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;border-radius:99px;font-size:10.5px;padding:0 5px;min-width:17px;text-align:center;font-weight:700}
.gs{flex:1;max-width:420px;position:relative;margin-left:8px}
.gs input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px 9px 36px;outline:none}
.gs input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.gs .si{position:absolute;left:11px;top:10px;color:var(--ink3)}
.gsr{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:50;padding:6px}
.gsr a{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13.5px}.gsr a:hover{background:var(--slate-l)}.gsr small{color:var(--ink3);margin-left:auto}
.sp{flex:1}
.menu{position:absolute;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:210px;padding:6px;z-index:60}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.menu a:hover,.menu button:hover{background:var(--slate-l)}
.av{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;cursor:pointer;border:0}
.content{padding:22px;max-width:1320px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{display:none}
/* components */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,box-shadow .12s,background .12s;white-space:nowrap}
.btn:hover{background:var(--slate-l)}.btn:active{transform:scale(.98)}
.btn-primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(91,70,230,.3)}.btn-primary:hover{background:var(--grad);filter:brightness(1.07)}
.btn-danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}.btn-ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,var(--line))}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.55;cursor:wait}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0;border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.card h3{font-size:15.5px;letter-spacing:-.01em}.muted{color:var(--ink2);font-size:13px}.tiny{font-size:12px;color:var(--ink3)}
.pg-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.pg-head h2{font-size:22px;letter-spacing:-.02em}.pg-head p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
.kpi{display:flex;gap:13px;align-items:center;position:relative;overflow:hidden;transition:transform .15s}.kpi:hover{transform:translateY(-2px)}
.kpi .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.kpi b{font-size:24px;letter-spacing:-.02em;display:block;line-height:1.15}.kpi span{font-size:12.5px;color:var(--ink2)}.kpi small{display:block;font-size:11.5px;color:var(--ink3)}
.i-blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}.i-violet{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.i-green{background:linear-gradient(135deg,#22c55e,#15803d)}.i-red{background:linear-gradient(135deg,#f87171,#dc2626)}.i-amber{background:linear-gradient(135deg,#fbbf24,#d97706)}.i-navy{background:linear-gradient(135deg,#334fb4,#0b1544)}.i-teal{background:linear-gradient(135deg,#2dd4bf,#0f766e)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.c-active,.c-verified,.c-resolved,.c-success{background:var(--green-l);color:var(--green)}.c-trial,.c-open,.c-info,.c-normal{background:var(--blue-l);color:var(--blue)}
.c-suspended,.c-rejected,.c-danger,.c-urgent,.c-failed{background:var(--red-l);color:var(--red)}.c-expired,.c-pending,.c-grace,.c-warning,.c-high{background:var(--amber-l);color:var(--amber)}.c-refunded,.c-low,.c-unknown{background:var(--slate-l);color:var(--ink2)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);outline:none;min-width:0}
.bar input[type=search]{flex:1;min-width:170px}
.fg{margin-bottom:12px;min-width:0}.fg label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);outline:none}
.fg textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.hint{font-size:12.5px;color:var(--ink2);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:var(--red-l);color:var(--red);padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:12px}
.note{background:var(--blue-l);color:var(--ink);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px}
.note.warn{background:var(--amber-l)}.note.bad{background:var(--red-l)}.note.good{background:var(--green-l)}
.empty{text-align:center;color:var(--ink2);padding:42px 12px}.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px}
.sk{background:linear-gradient(90deg,var(--slate-l),var(--surface2),var(--slate-l));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:84px}@keyframes sk{to{background-position:-200% 0}}
/* table */
.tw{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--blue)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:color-mix(in srgb,var(--blue-l) 45%,transparent)}
td.r,th.r{text-align:right}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pager{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:12px 4px 2px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:14px;border:1px solid var(--line);overflow-x:auto;margin-bottom:14px;width:fit-content;max-width:100%}
.tab{border:0;background:none;padding:8px 14px;font-weight:700;color:var(--ink2);border-radius:10px;cursor:pointer;white-space:nowrap}.tab.on{background:var(--grad);color:#fff}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.it .dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}.kv dt{color:var(--ink2)}.kv dd{margin:0;word-break:break-word}
.chart text{fill:var(--ink3);font-size:10.5px}.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.pb{height:8px;background:var(--slate-l);border-radius:99px;overflow:hidden}.pb i{display:block;height:100%;background:var(--grad)}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--surface);overflow:hidden}
.acc summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}.acc summary::-webkit-details-marker{display:none}
.acc div.b{padding:0 16px 14px;color:var(--ink2);font-size:14px}.acc ol,.acc ul{margin:6px 0;padding-left:20px}
.msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:40vh;overflow:auto}.msg{background:var(--slate-l);padding:10px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap}.msg small{display:block;color:var(--ink3);margin-bottom:2px}
/* modal */
.back{position:fixed;inset:0;background:rgba(8,12,40,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;animation:fade .15s}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:22px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(8,12,40,.45);overflow:hidden}.modal.lg{max-width:860px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}.mh h2{font-size:18px;flex:1}
.mb{padding:18px 20px;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
.mf{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);margin:16px -20px -18px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;z-index:120;font-size:14px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:fade .2s}.toast.bad{background:#b91c1c}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .art{background:linear-gradient(160deg,#0b1544,#1d3a9e 60%,#5b21b6);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login .art h1{font-size:34px;letter-spacing:-.03em;line-height:1.15}.login .art p{opacity:.8;max-width:420px}
.login .frm{display:grid;place-items:center;padding:24px}.login .frm .card{width:100%;max-width:380px;padding:26px}
/* docs */
.doc{background:#fff;color:#111;border:1px solid #ddd;border-radius:10px;padding:28px;font-size:13.5px}
.doc h1{font-size:22px;margin:0 0 2px}.doc table{margin:14px 0}.doc th{background:#f3f4f6;color:#333}.doc td,.doc th{border-bottom:1px solid #e5e7eb}
.doc .hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #1e3a8a;padding-bottom:12px;margin-bottom:12px}
.doc .stamp{display:inline-block;border:3px solid #15803d;color:#15803d;font-weight:800;padding:2px 14px;border-radius:8px;transform:rotate(-6deg);letter-spacing:.1em}.doc .stamp.un{border-color:#b45309;color:#b45309}
#print-root{display:none}.mob{display:none}@media(max-width:900px){.mob{display:grid}}
@media print{body>*:not(#print-root){display:none!important}#print-root{display:block}body{background:#fff}.doc{border:0}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
  .side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(8,12,40,.5);z-index:35}
  .main{margin-left:0}.content{padding:14px}.topbar{padding:10px 12px}.gs{display:none}.gs.show{display:block;position:absolute;left:12px;right:12px;top:58px;max-width:none;margin:0}
  .login{grid-template-columns:1fr}.login .art{display:none}
}
@media(max-width:720px){
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}.kpi{padding:14px}.kpi b{font-size:20px}.kpi .ico{width:40px;height:40px}.row2{grid-template-columns:1fr}
  .topbar .ttl{font-size:16px}.kv{grid-template-columns:1fr}.kv dt{font-size:12px}
  table.st thead{display:none}table.st,table.st tbody,table.st tr,table.st td{display:block;width:100%}
  table.st tr{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 4px;background:var(--surface)}
  table.st td{border:0;display:flex;justify-content:space-between;gap:12px;padding:6px 10px;text-align:right}
  table.st td::before{content:attr(data-l);color:var(--ink2);font-size:12px;font-weight:700;text-align:left;flex:none}
  table.st td.acts-c{justify-content:flex-end}table.st td.acts-c::before{display:none}
  .modal{border-radius:0;max-width:none;height:100vh;height:100dvh;max-height:none}.back{padding:0}
}
@media(max-width:720px){.list .it{flex-wrap:wrap}.list .it .tx{flex:1 1 55%}}
@media(max-width:440px){.g4,.g3,.g2{grid-template-columns:1fr}.topbar [data-m=quick]{display:none}.topbar [data-menu]:has([data-m=quick]){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  b.innerHTML = `<div class="modal ${o.lg ? 'lg' : ''}" role="dialog" aria-modal="true"><div class="mh"><h2>${title}</h2><button class="ib" data-act="close" aria-label="${esc(t('close'))}">${ic('x')}</button></div><div class="mb">${body}</div></div>`;

const foot = (ok, extra = '') => `<div class="mf">${extra}<button type="button" class="btn" data-act="close">${t('cancel')}</button><button class="btn btn-primary" data-ok>${ok || t('save')}</button></div>`;

const rpc = async (name, args) => { const { data, error } = await sb.rpc(name, args || {}); if (error) throw error; return data; };
async function run(btn, fn, okMsg) { return busy(btn, async () => { try { const r = await fn(); if (okMsg) toast(okMsg); return r === undefined ? true : r; } catch (e) { console.error(e); toast(errTxt(e), true); return false; } }); }
function confirmBox(msg, o = {}) {
  return new Promise(res => {
    const m = modal(esc(o.title || t('confirm')), `<p style="margin:0 0 4px">${esc(msg)}</p>${o.extra || ''}${foot(esc(o.ok || t('yes')))}`);
    if (o.danger) $('[data-ok]', m).classList.add('btn-danger');
    let done = false; const fin = v => { if (!done) { done = true; closeModal(); res(v); } };
    $('[data-ok]', m).onclick = () => fin(true); m.addEventListener('click', e => { if (e.target.closest('[data-act=close]') || e.target === m) fin(false); }, true);

/* ---------- CSV / print ---------- */
function downloadCSV(name, rows) {
  const q = v => { v = v == null ? '' : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '-' + today() + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function printHTML(html) { const r = $('#print-root'); r.innerHTML = html; setTimeout(() => { window.print(); setTimeout(() => { r.innerHTML = ''; }, 800); }, 50); }

/* ---------- tables ---------- */
function table(id, cols, rows, o = {}) {
  const st = F(id), size = o.size || 10; let list = rows;
  if (st.sort) { const c = cols.find(x => x.k === st.sort); if (c && c.v) list = [...rows].sort((a, b) => { const x = c.v(a) ?? '', y = c.v(b) ?? ''; return (x > y ? 1 : x < y ? -1 : 0) * (st.dir || 1); }); }
  const pages = Math.max(1, Math.ceil(list.length / size)); st.page = Math.min(Math.max(1, st.page || 1), pages);
  const from = (st.page - 1) * size, slice = list.slice(from, from + size);
  if (!rows.length) return o.empty || '';
  return `<div class="card" style="padding:6px 10px 12px"><div class="tw"><table class="st"><thead><tr>${cols.map(c => `<th class="${c.v ? 's' : ''} ${c.r ? 'r' : ''}" ${c.v ? `data-act="sort" data-t="${id}" data-k="${c.k}"` : ''}>${esc(c.l)}${st.sort === c.k ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${slice.map(r => `<tr>${cols.map(c => `<td data-l="${esc(c.l)}" class="${c.r ? 'r' : ''} ${c.acts ? 'acts-c' : ''}">${c.h(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="pager"><span class="muted">${from + 1}–${Math.min(from + size, list.length)} / ${list.length}</span><span class="acts"><button class="btn btn-sm" data-act="pg" data-t="${id}" data-d="-1" ${st.page <= 1 ? 'disabled' : ''}>‹</button><span class="muted" style="align-self:center">${st.page}/${pages}</span><button class="btn btn-sm" data-act="pg" data-t="${id}" data-d="1" ${st.page >= pages ? 'disabled' : ''}>›</button></span></div></div>`;
}

/* ---------- charts (inline SVG, theme aware) ---------- */
function barChart(vals, labels, o = {}) {
  const W = 560, H = o.h || 190, pad = { l: 8, r: 8, t: 14, b: 24 }, max = Math.max(...vals, 1), bw = (W - pad.l - pad.r) / vals.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label || '')}"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
    ${[0, .5, 1].map(f => `<line class="gl" x1="${pad.l}" x2="${W - pad.r}" y1="${pad.t + (H - pad.t - pad.b) * f}" y2="${pad.t + (H - pad.t - pad.b) * f}"/>`).join('')}
    ${vals.map((v, i) => { const h = (H - pad.t - pad.b) * v / max, x = pad.l + i * bw + bw * .18; return `<rect x="${x}" y="${H - pad.b - h}" width="${bw * .64}" height="${Math.max(h, v > 0 ? 2 : 0)}" rx="5" fill="url(#bg1)"><title>${esc(labels[i])}: ${o.fmt ? o.fmt(v) : num(v)}</title></rect><text x="${x + bw * .32}" y="${H - 8}" text-anchor="middle">${esc(labels[i].slice(o.cut ?? 5))}</text>`; }).join('')}</svg>`;
}
function lineChart(vals, labels, o = {}) {
  const W = 560, H = o.h || 190, pad = { l: 10, r: 10, t: 14, b: 24 }, max = Math.max(...vals, 1), step = (W - pad.l - pad.r) / Math.max(vals.length - 1, 1);
  const pts = vals.map((v, i) => [pad.l + i * step, H - pad.b - (H - pad.t - pad.b) * v / max]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label || '')}"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>
    ${[0, .5, 1].map(f => `<line class="gl" x1="${pad.l}" x2="${W - pad.r}" y1="${pad.t + (H - pad.t - pad.b) * f}" y2="${pad.t + (H - pad.t - pad.b) * f}"/>`).join('')}
    <path d="${d} L${pts[pts.length - 1][0]} ${H - pad.b} L${pts[0][0]} ${H - pad.b} Z" fill="url(#lg1)"/><path d="${d}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#2563eb" stroke-width="2"><title>${esc(labels[i])}: ${num(vals[i])}</title></circle>${i % 2 === 0 || vals.length < 8 ? `<text x="${p[0]}" y="${H - 8}" text-anchor="middle">${esc(labels[i].slice(5))}</text>` : ''}`).join('')}</svg>`;
}
function donut(parts, o = {}) {
  const tot = parts.reduce((a, p) => a + p.v, 0), R = 52, C = 2 * Math.PI * R; let acc = 0;
  const segs = tot ? parts.filter(p => p.v > 0).map(p => { const len = C * p.v / tot, s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"><title>${esc(p.l)}: ${p.v}</title></circle>`; acc += len; return s; }).join('') : `<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="18"/>`;
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="150" role="img" aria-label="${esc(o.label || '')}">${segs}<text x="70" y="68" text-anchor="middle" style="font-size:24px;font-weight:800;fill:var(--ink)">${tot}</text><text x="70" y="86" text-anchor="middle" style="font-size:10px;fill:var(--ink3)">${esc(o.center || '')}</text></svg>
    <div class="legend" style="flex-direction:column;margin:0;gap:6px">${parts.map(p => `<span><i style="background:${p.c}"></i>${esc(p.l)}: <b>${p.v}</b></span>`).join('')}</div></div>`;
}

async function schoolAccount(body) {

  if (!r.error) return r.data;
  let j = null; try { j = await r.error.context.json(); } catch (e) { }
  const map = { nothing: 'sl_nothing', weak_password: 'sl_weak', bad_email: 'sl_bad_email', email_taken: 'sl_taken', forbidden: 'sl_forbidden', need_both: 'sl_need_both', choose: 'sl_choose' };
  if (j && map[j.code]) throw new Error(t(map[j.code]));
  if (/not.?found|Failed to send|FunctionsFetch|FunctionsRelay/i.test((j && (j.message || j.error)) || r.error.message || '')) throw new Error(t('sl_nosvc'));
  throw new Error((j && (j.error || j.message)) || r.error.message || t('sl_failed'));
}

    <div class="scrim ${S.nav ? 'open' : ''}" data-act="nav"></div>
    <div class="main"><header class="topbar"><button class="ib mob" data-act="nav" aria-label="Menu">${ic('menu')}</button><div class="ttl">${t(NAVKEY[S.page])}</div>
      <div class="gs ${S.gsOpen ? 'show' : ''}"><span class="si">${ic('search', 17)}</span><input data-b="gs.q" value="${esc(S.gq)}" placeholder="${esc(t('gsearch'))}" autocomplete="off" aria-label="${esc(t('gsearch'))}"><div id="gsr" class="gsr" ${S.gq ? '' : 'hidden'}>${searchHTML()}</div></div><span class="sp"></span>
      <button class="ib mob" data-act="gs-toggle" aria-label="${esc(t('gsearch'))}">${ic('search')}</button>
      <div style="position:relative" data-menu><button class="ib" data-act="menu" data-m="quick" aria-label="${esc(t('quick'))}">${ic('plus')}</button>${S.menu === 'quick' ? `<div class="menu"><button data-act="school-new">${ic('school', 17)} ${t('newschool')}</button><button data-act="pay-new">${ic('cash', 17)} ${t('recpay')}</button><button data-act="ticket-new">${ic('life', 17)} ${t('new_ticket')}</button></div>` : ''}</div>
      <button class="ib" data-act="lang" aria-label="Language" title="${LANG === 'so' ? 'English' : 'Soomaali'}"><b style="font-size:12px">${LANG === 'so' ? 'EN' : 'SO'}</b></button>
      <button class="ib" data-act="theme" aria-label="${esc(t('theme'))}">${ic(dark ? 'sun' : 'moon')}</button>
      <button class="ib" data-act="go" data-p="notifications" aria-label="${esc(t('nav_notif'))}">${ic('bell')}${un ? `<span class="dt">${un > 99 ? '99+' : un}</span>` : ''}</button>
      <div style="position:relative" data-menu><button class="av" data-act="menu" data-m="user" aria-label="${esc(t('nav_profile'))}">${esc(initials(me.full_name || me.email))}</button>${S.menu === 'user' ? `<div class="menu"><div style="padding:8px 12px"><b>${esc(me.full_name || me.email || '')}</b><div class="tiny">${esc(me.email || '')}</div></div><a data-act="go" data-p="profile">${ic('user', 17)} ${t('nav_profile')}</a><a data-act="go" data-p="settings">${ic('settings', 17)} ${t('nav_settings')}</a><button data-act="out">${ic('logout', 17)} ${t('out')}</button></div>` : ''}</div></header>
    <main class="content" id="content">${inner}</main></div></div>`;
}
function searchHTML() {
  const q = S.gq.trim().toLowerCase(); if (!q) return '';
  const r = [];
  S.schools.filter(s => (s.name + ' ' + (s.short_name || '') + ' ' + (s.email || '') + ' ' + (s.admin_emails || '')).toLowerCase().includes(q)).slice(0, 5).forEach(s => r.push(`<a data-act="school-view" data-id="${esc(s.id)}">${ic('school', 16)} ${esc(s.name)}<small>${t('nav_schools')}</small></a>`));
  S.pays.filter(p => [p.reference, p.invoice_no, p.receipt_no, p.school_name].join(' ').toLowerCase().includes(q)).slice(0, 5).forEach(p => r.push(`<a data-act="pay-view" data-id="${esc(p.id)}">${ic('cash', 16)} ${esc(p.invoice_no || money(p.amount, p.currency))} · ${esc(p.school_name)}<small>${t('nav_pay')}</small></a>`));
  S.tickets.filter(x => (x.subject + ' ' + (x.school_name || '')).toLowerCase().includes(q)).slice(0, 4).forEach(x => r.push(`<a data-act="ticket-open" data-id="${esc(x.id)}">${ic('life', 16)} ${esc(x.subject)}<small>${t('nav_support')}</small></a>`));
  return r.join('') || `<div class="muted" style="padding:10px">${t('no_match')}</div>`;
}
function render() {
  const a = document.activeElement, key = a && a.dataset && a.dataset.b, pos = a && a.selectionStart, sy = window.scrollY;
  if (!S.loaded) { app.innerHTML = shell(skeleton()); return; }
  let inner; try { inner = VIEW[S.page](); } catch (e) { console.error(e); inner = `<div class="err">${esc(errTxt(e))}</div>`; }
  app.innerHTML = shell(inner);
  if (key) { const n = $('[data-b="' + key + '"]'); if (n) { n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch (e) { } } }
  window.scrollTo(0, sy);
}
const PAGES = Object.keys(NAVKEY);
async function navigate() {
  let p = (location.hash || '').replace(/^#\/?/, ''); if (!PAGES.includes(p)) p = 'dashboard';
  S.page = p; S.nav = false; S.menu = null; S.gsOpen = false;
  if (S.loaded && PRE[p]) { try { await PRE[p](); } catch (e) { toast(errTxt(e), true); } }
  render(); window.scrollTo(0, 0);
}
const go = p => { if (location.hash === '#/' + p) navigate(); else location.hash = '#/' + p; };
window.addEventListener('hashchange', () => { if (S.user) navigate(); });

/* ---------- data ---------- */
async function loadAll() {
  try { await sb.rpc('platform_scan'); } catch (e) { }
  const q = p => p.then(r => { if (r.error) throw r.error; return r.data || []; });
  const [sch, pay, logs, plans, notifs, set, tk] = await Promise.all([q(sb.rpc('platform_schools')), q(sb.rpc('platform_payments_list')), q(sb.rpc('platform_logs_list', { p_limit: 2000 })), q(sb.from('platform_plans').select('*').order('sort_order')),
    q(sb.from('platform_notifications').select('*').order('created_at', { ascending: false }).limit(300)), q(sb.from('platform_settings').select('*')), q(sb.from('platform_tickets').select('*').order('updated_at', { ascending: false }).limit(500))]);
  S.schools = sch; S.pays = pay; S.logs = logs; S.plans = plans; S.notifs = notifs; S.tickets = tk; S.settings = {}; set.forEach(x => { S.settings[x.key] = x.value; });
}
async function reload(quiet) { try { await loadAll(); } catch (e) { toast(errTxt(e), true); } render(); }

/* ---------- login / boot ---------- */
function showLogin(msg) {
  S.user = null; S.loaded = false;
  app.innerHTML = `<div class="login"><div class="art"><div class="brand" style="padding:0"><div class="lg">${ic('school', 22)}</div><div><b>${esc(t('title'))}</b><span>${t('console')}</span></div></div><h1>${t('login_hero')}</h1><p>${t('login_sub')}</p></div>
    <div class="frm"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="font-size:20px">${t('login')}</h2><button class="ib" data-act="lang" aria-label="Language"><b style="font-size:12px">${LANG === 'so' ? 'EN' : 'SO'}</b></button></div>
    ${msg ? `<div class="err" role="alert">${esc(msg)}</div>` : ''}<form id="lf"><div class="fg"><label>${t('email')}</label><input id="le" type="email" autocomplete="username" required></div><div class="fg"><label>${t('pass')}</label><input id="lp" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%;justify-content:center" id="lb">${t('login')}</button></form></div></div></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); await busy($('#lb'), async () => { const { error } = await sb.auth.signInWithPassword({ email: $('#le').value.trim(), password: $('#lp').value }); if (error) return showLogin(error.message); await boot(true); }); };
}
function showMfa() {
  app.innerHTML = `<div class="login"><div class="art"><h1>${t('mfa_title')}</h1><p>${t('mfa_login_h')}</p></div><div class="frm"><div class="card"><h2 style="font-size:20px;margin-bottom:12px">${t('mfa_title')}</h2><form id="mf"><div class="fg"><label>${t('mfa_code')}</label><input id="mc" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" autofocus></div><button class="btn btn-primary" style="width:100%;justify-content:center" id="mb">${t('verify')}</button> <button type="button" class="btn" style="width:100%;justify-content:center;margin-top:8px" data-act="out">${t('out')}</button></form></div></div></div>`;
  $('#mf').onsubmit = async e => { e.preventDefault(); await busy($('#mb'), async () => { try { const fs = await sb.auth.mfa.listFactors(); const f = (fs.data.totp || []).find(x => x.status === 'verified'); const c = await sb.auth.mfa.challenge({ factorId: f.id }); if (c.error) throw c.error; const v = await sb.auth.mfa.verify({ factorId: f.id, challengeId: c.data.id, code: $('#mc').value.trim() }); if (v.error) throw v.error; await boot(true); } catch (er) { toast(errTxt(er), true); } }); };
}
function showSetup(msg) {
  app.innerHTML = `<div class="login"><div class="art"><h1>${t('setup_title')}</h1><p>${t('setup_sub')}</p></div><div class="frm"><div class="card"><h2 style="font-size:20px;margin-bottom:10px">${t('setup_title')}</h2><div class="err">${esc(msg)}</div><p class="muted">${t('setup_body')}</p><button class="btn" data-act="out" style="width:100%;justify-content:center">${t('out')}</button></div></div></div>`;
}
async function boot(fresh) {
  if (!sb) return showLogin('Supabase library failed to load.');
  const { data: u } = await sb.auth.getUser(); if (!u || !u.user) return showLogin();
  try { const lv = await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if (lv && lv.data && lv.data.nextLevel === 'aal2' && lv.data.currentLevel !== 'aal2') return showMfa(); } catch (e) { }
  const { data: p, error } = await sb.from('profiles').select('id,email,full_name,is_super_admin').eq('id', u.user.id).maybeSingle();
  if (error || !p || p.is_super_admin !== true) { await sb.auth.signOut(); return showLogin(t('notallowed')); }
  S.me = p; S.user = u.user; S.loaded = false; render();
  try { await loadAll(); } catch (e) { const m = errTxt(e); if (/does not exist|schema cache|Could not find|column/i.test(m)) return showSetup(m); await sb.auth.signOut(); return showLogin(m); }
  S.loaded = true; if (fresh) { try { await rpc('platform_log_event', { p_action: 'login' }); S.logs = await rpc('platform_logs_list', { p_limit: 2000 }); } catch (e) { } }
  await navigate();
}

/* ---------- global actions + events ---------- */
Object.assign(ACT, {
  go(el) { const set = el.dataset.set; if (set) { const [k, v] = set.split('='); const [id, key] = k.split('.'); F(id)[key] = v; F(id).page = 1; } closeModal(); go(el.dataset.p); },
  close() { closeModal(); }, nav() { S.nav = !S.nav; render(); }, reload() { reload(); },
  menu(el) { S.menu = S.menu === el.dataset.m ? null : el.dataset.m; render(); },
  'gs-toggle'() { S.gsOpen = !S.gsOpen; render(); if (S.gsOpen) { const i = $('.gs input'); i && i.focus(); } },
  lang() { LANG = LANG === 'so' ? 'en' : 'so'; LS.set('pl_lang', LANG); document.documentElement.lang = LANG; if (S.user) render(); else showLogin(); },
  theme() { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; LS.set('pl_theme', d); render(); },
  sort(el) { const st = F(el.dataset.t); st.dir = st.sort === el.dataset.k ? -(st.dir || 1) : 1; st.sort = el.dataset.k; render(); },
  pg(el) { const st = F(el.dataset.t); st.page = (st.page || 1) + Number(el.dataset.d); render(); },
  async out() { try { if (S.user) await rpc('platform_log_event', { p_action: 'logout' }); } catch (e) { } await sb.auth.signOut(); S.user = null; S.loaded = false; closeModal(); showLogin(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) {
    const hadMenu = !!S.menu && el.dataset.act !== 'menu', hadQ = !!S.gq && !!el.closest('.gsr');
    if (hadMenu) S.menu = null; if (hadQ) S.gq = '';
    try { const r = ACT[el.dataset.act](el, e); if (r && r.catch) r.catch(er => toast(errTxt(er), true)); } catch (er) { console.error(er); toast(errTxt(er), true); }
    if ((hadMenu || hadQ) && el.dataset.act !== 'go') render();
    return;
  }
  if (S.menu && !e.target.closest('[data-menu]')) { S.menu = null; render(); }
  if (S.gq && !e.target.closest('.gs')) { S.gq = ''; render(); }
});
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.b; if (!b) return; const [id, k] = b.split('.');
  if (id === 'gs') { S.gq = e.target.value; const r = $('#gsr'); if (r) { r.hidden = !S.gq; r.innerHTML = searchHTML(); } return; }
  const st = F(id); st[k] = e.target.type === 'checkbox' ? (e.target.checked ? '1' : '') : e.target.value; if (k !== 'page') st.page = 1; render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); if (S.menu) { S.menu = null; render(); } } if (e.key === 'Enter' && e.target.matches && e.target.matches('.nav a')) e.target.click(); });
document.documentElement.dataset.theme = LS.get('pl_theme', (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
document.documentElement.lang = LANG;
boot();
</script>
</body>
