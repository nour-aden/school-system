<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Platform Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--line:#e5e9f2;--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#eaf1ff;--navy:#0f2557;--green:#15803d;--green-l:#e6f6ec;--red:#dc2626;--red-l:#fdecec;--amber:#b45309;--amber-l:#fff3dc;--slate-l:#eef1f6;--radius:14px;--shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,var(--navy),#1e40af);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;flex:1}
.top .sub{font-size:12px;opacity:.8}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{background:var(--slate-l)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-danger{color:var(--red);border-color:#f3c3c3}.btn-sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.lang{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.top .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;min-width:0}
.stat b{display:block;font-size:24px}.stat span{font-size:12.5px;color:var(--ink2)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{font-size:16px;margin:0 0 2px;word-break:break-word}
.muted{color:var(--ink2);font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.c-active{background:var(--green-l);color:var(--green)}.c-trial{background:var(--blue-l);color:var(--blue)}
.c-suspended{background:var(--red-l);color:var(--red)}.c-expired{background:var(--amber-l);color:var(--amber)}
.meta{display:flex;gap:14px;margin:10px 0;font-size:13.5px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:24px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fg input,.fg select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.hint{font-size:12.5px;color:var(--ink2);margin-top:4px}
.err{background:var(--red-l);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.back{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:600px){.back{align-items:center}.modal{border-radius:18px}}
.modal h2{font-size:18px;margin:0 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw}
.empty{text-align:center;color:var(--ink2);padding:40px 10px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:52px;z-index:4}
.tab{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--blue);border-color:var(--blue)}
.dot{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:6px}
.sec{font-size:15px;margin:18px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;padding:12px 14px;flex-wrap:wrap}
.stat.wide{grid-column:span 2}.stat b.sm{font-size:18px}
.stats{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://bfozghbwpyspotpblcyr.supabase.co";
const SUPABASE_KEY = "sb_publishable_AkI4NAyrbLlnvmMiAfPaUQ_vO6C8UqJ";
const I = {
  so: { title:'Console-ka Platform-ka', login:'Gal', email:'Email', pass:'Erayga sirta ah', out:'Ka bax', notallowed:'Akoonkan ma laha ogolaansho. Console-kan waa kan super-admin kaliya.',
    total:'Dugsiyada', active:'Firfircoon', trial:'Tijaabo', attention:'Dhammaanaya / xidhan', search:'Raadi dugsi...', newschool:'+ Dugsi cusub', none:'Weli dugsi ma jiro. Riix "Dugsi cusub".',
    students:'ardayda', teachers:'macallimiin', admins:'Maamule', noexp:'Wakhti xaddid ma leh', daysleft:'{n} maalmood ayaa hadhay', expired_on:'Dhammaaday {d}',
    tabs_dash:'Dashboard', tabs_schools:'Dugsiyada', tabs_pay:'Lacagaha', tabs_log:'Hawlaha', alerts:'Digniino kirada', alerts_none:'Dugsi la digayo ma jiro. Wax walba waa fiicanyihiin.', revenue:'Dakhliga bishan', revenue_all:'Wadarta guud', recent:'Hawlihii ugu dambeeyay', no_pay:'Weli lacag lama diiwaangelin.', no_log:'Weli hawl ma jirto.', edit:'Wax ka beddel', pay:'Lacag', recpay:'+ Diiwaan geli lacag', amount:'Lacagta', currency:'Lacagta nooca', method:'Habka', m_cash:'Cash', m_bank:'Bangi', m_mobile:'Mobile money', paid_on:'Taariikhda', months:'Kordhi rukhsadda', m_0:'Ha kordhin', m_n:'{n} bil', note:'Faallo', school:'Dugsiga', del:'Tirtir', confirm_delpay:'Tirtir lacagtan? Rukhsadda lama dib u celin.', phone:'Telefoon', address:'Cinwaanka', edit_school:'Wax ka beddel dugsiga', pay_saved:'Lacagta waa la diiwaangeliyay', total_students:'Ardayda guud', total_teachers:'Macallimiinta guud', susp_exp:'Xidhan / dhammaaday', a_school_created:'Dugsi la abuuray', a_school_updated:'Dugsi la beddelay', a_subscription:'Rukhsad la beddelay', a_admin_added:'Maamule la daray', a_payment:'Lacag la diiwaangeliyay', a_payment_deleted:'Lacag la tirtiray', m1:'+1 bil', y1:'+1 sano', suspend:'Xidh', activate:'Fur', editsub:'Rukhsad', addadmin:'+ Maamule', cancel:'Jooji', save:'Keydi', create:'Abuur dugsiga',
    n_name:'Magaca dugsiga', n_short:'Magaca gaaban', n_type:'Nooca', n_lang:'Luqadda', n_cur:'Lacagta', n_email:'Email-ka maamulaha', n_email_h:'Marka hore u abuur user-kan: Supabase → Authentication → Users → Add user.',
    n_status:'Xaaladda', n_ends:'Rukhsad dhammaata', plan:'Plan', cycle:'Bixinta', monthly:'Bille', annual:'Sannadle', none_opt:'—',
    st_active:'Firfircoon', st_trial:'Tijaabo', st_suspended:'Xidhan', st_expired:'Dhammaaday', created:'Dugsiga waa la abuuray', saved:'Waa la keydiyay', added:'Maamulaha waa lagu daray',
    confirm_susp:'Ma xidhaa "{n}"? Dadkiisa ma geli karaan ilaa aad dib u furto.', t_p:'Hoose', t_s:'Sare', t_ps:'Hoose + Sare', ok:'Waa la sameeyay' },
  en: { title:'Platform Console', login:'Sign in', email:'Email', pass:'Password', out:'Sign out', notallowed:'This account is not allowed. This console is for the super admin only.',
    total:'Schools', active:'Active', trial:'Trial', attention:'Expiring / suspended', search:'Search schools...', newschool:'+ New school', none:'No schools yet. Tap "New school".',
    students:'students', teachers:'teachers', admins:'Admin', noexp:'No expiry', daysleft:'{n} days left', expired_on:'Ended {d}',
    tabs_dash:'Dashboard', tabs_schools:'Schools', tabs_pay:'Payments', tabs_log:'Activity', alerts:'Expiry alerts', alerts_none:'Nothing expiring soon. All good.', revenue:'Revenue this month', revenue_all:'All-time total', recent:'Recent activity', no_pay:'No payments recorded yet.', no_log:'No activity yet.', edit:'Edit', pay:'Payment', recpay:'+ Record payment', amount:'Amount', currency:'Currency', method:'Method', m_cash:'Cash', m_bank:'Bank', m_mobile:'Mobile money', paid_on:'Date', months:'Extend subscription', m_0:'Do not extend', m_n:'{n} month(s)', note:'Note', school:'School', del:'Delete', confirm_delpay:'Delete this payment? The subscription is not rolled back.', phone:'Phone', address:'Address', edit_school:'Edit school', pay_saved:'Payment recorded', total_students:'Total students', total_teachers:'Total teachers', susp_exp:'Suspended / expired', a_school_created:'School created', a_school_updated:'School updated', a_subscription:'Subscription changed', a_admin_added:'Admin added', a_payment:'Payment recorded', a_payment_deleted:'Payment deleted', m1:'+1 month', y1:'+1 year', suspend:'Suspend', activate:'Activate', editsub:'Subscription', addadmin:'+ Admin', cancel:'Cancel', save:'Save', create:'Create school',
    n_name:'School name', n_short:'Short name', n_type:'Type', n_lang:'Language', n_cur:'Currency', n_email:'Admin email', n_email_h:'Create this user first: Supabase → Authentication → Users → Add user.',
    n_status:'Status', n_ends:'Subscription ends', plan:'Plan', cycle:'Billing', monthly:'Monthly', annual:'Annual', none_opt:'—',
    st_active:'Active', st_trial:'Trial', st_suspended:'Suspended', st_expired:'Expired', created:'School created', saved:'Saved', added:'Admin added',
    confirm_susp:'Suspend "{n}"? Its users cannot sign in until you reactivate.', t_p:'Primary', t_s:'Secondary', t_ps:'Primary + Secondary', ok:'Done' }
};
let LANG = (() => { try { return localStorage.getItem('pl_lang') || 'so'; } catch (e) { return 'so'; } })();
const t = (k, v) => String((I[LANG][k] ?? I.en[k] ?? k)).replace(/\{(\w+)\}/g, (_, x) => v && v[x] != null ? v[x] : '');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const authStore = (() => { try { sessionStorage.setItem('_t', '1'); sessionStorage.removeItem('_t'); return sessionStorage; } catch (e) { const m = {}; return { getItem: k => m[k] ?? null, setItem: (k, v) => { m[k] = v; }, removeItem: k => { delete m[k]; } }; } })();
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: authStore, storageKey: 'platform-console-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }) : null;
const $ = s => document.querySelector(s);
const S = { schools: [], pays: [], logs: [], q: '', tab: 'dash' };
const app = $('#app');

function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
const rpcErr = e => (e && e.message) ? e.message : String(e);
function closeModal() { document.querySelectorAll('.back').forEach(x => x.remove()); }
function modal(html) { closeModal(); const b = document.createElement('div'); b.className = 'back'; b.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; b.addEventListener('mousedown', e => { if (e.target === b) closeModal(); }); document.body.appendChild(b); return b; }
async function busy(btn, fn) { if (btn) btn.disabled = true; try { return await fn(); } finally { if (btn) btn.disabled = false; } }

function showLogin(msg) {
  app.innerHTML = `<div class="login"><div class="card"><h2 style="margin:0 0 4px">${esc(t('title'))}</h2><div class="muted" style="margin-bottom:16px">&nbsp;</div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <form id="lf"><div class="fg"><label>${t('email')}</label><input id="le" type="email" autocomplete="username" required></div>
    <div class="fg"><label>${t('pass')}</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" style="width:100%" id="lb">${t('login')}</button></form></div></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    await busy($('#lb'), async () => {
      const { error } = await sb.auth.signInWithPassword({ email: $('#le').value.trim(), password: $('#lp').value });
      if (error) return showLogin(error.message);
      await boot();
    });
  };
}

async function boot() {
  if (!sb) return showLogin('Supabase library failed to load.');
  const { data: u } = await sb.auth.getUser();
  if (!u || !u.user) return showLogin();
  const { data: p, error } = await sb.from('profiles').select('is_super_admin').eq('id', u.user.id).maybeSingle();
  if (error || !p || p.is_super_admin !== true) { await sb.auth.signOut(); return showLogin(t('notallowed')); }
  await load();
}

async function load() {
  const [a, b, c] = await Promise.all([sb.rpc('platform_schools'), sb.rpc('platform_payments_list'), sb.rpc('platform_logs_list', { p_limit: 200 })]);
  if (a.error) { await sb.auth.signOut(); return showLogin(rpcErr(a.error)); }
  S.schools = a.data || []; S.pays = b.data || []; S.logs = c.data || [];
  draw();
}

const DAY = 86400000;
function daysLeft(s) { return s.subscription_ends_at ? Math.ceil((new Date(s.subscription_ends_at) - Date.now()) / DAY) : null; }
function subLine(s) {
  const d = daysLeft(s);
  if (d === null) return t('noexp');
  const dt = new Date(s.subscription_ends_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  return d > 0 ? `${dt} · ${t('daysleft', { n: d })}` : t('expired_on', { d: dt });
}
function effStatus(s) { const d = daysLeft(s); return (s.status === 'active' || s.status === 'trial') && d !== null && d <= 0 ? 'expired' : s.status; }
const sumBy = list => { const m = {}; list.forEach(p => { m[p.currency] = (m[p.currency] || 0) + Number(p.amount); }); const k = Object.keys(m); return k.length ? k.map(c => `${m[c].toLocaleString('en-US', { maximumFractionDigits: 2 })} ${esc(c)}`).join(' · ') : '0'; };
const fdate = d => new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const ftime = d => new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const alertList = () => S.schools.filter(s => { const d = daysLeft(s), e = effStatus(s); return e === 'expired' || (e !== 'suspended' && d !== null && d <= 14); }).sort((x, y) => (daysLeft(x) ?? 9999) - (daysLeft(y) ?? 9999));

function draw() {
  const tabs = [['dash', 'tabs_dash'], ['schools', 'tabs_schools'], ['pay', 'tabs_pay'], ['log', 'tabs_log']];
  const al = alertList();
  app.innerHTML = `<div class="top"><div style="flex:1"><h1>${esc(t('title'))}</h1></div>
      <button class="lang" data-act="lang">${LANG === 'so' ? 'EN' : 'SO'}</button><button class="btn btn-sm" data-act="out">${t('out')}</button></div>
    <div class="tabs">${tabs.map(([id, k]) => `<button class="tab ${S.tab === id ? 'on' : ''}" data-act="tab" data-id="${id}">${t(k)}${id === 'dash' && al.length ? `<span class="dot">${al.length}</span>` : ''}</button>`).join('')}</div>
    <div class="wrap" id="body"></div>`;
  ({ dash: viewDash, schools: viewSchools, pay: viewPay, log: viewLog })[S.tab]($('#body'));
}

function viewDash(el) {
  const L = S.schools, eff = L.map(effStatus), mo = new Date().toISOString().slice(0, 7);
  const students = L.reduce((a, s) => a + Number(s.students), 0), teachers = L.reduce((a, s) => a + Number(s.teachers), 0);
  const al = alertList();
  el.innerHTML = `<div class="stats"><div class="stat"><b>${L.length}</b><span>${t('total')}</span></div>
      <div class="stat"><b>${eff.filter(x => x === 'active').length}</b><span>${t('active')}</span></div>
      <div class="stat"><b>${eff.filter(x => x === 'trial').length}</b><span>${t('trial')}</span></div>
      <div class="stat"><b>${eff.filter(x => x === 'suspended' || x === 'expired').length}</b><span>${t('susp_exp')}</span></div>
      <div class="stat"><b>${students.toLocaleString()}</b><span>${t('total_students')}</span></div>
      <div class="stat"><b>${teachers.toLocaleString()}</b><span>${t('total_teachers')}</span></div>
      <div class="stat wide"><b class="sm">${sumBy(S.pays.filter(p => p.paid_on.slice(0, 7) === mo))}</b><span>${t('revenue')}</span></div>
      <div class="stat wide"><b class="sm">${sumBy(S.pays)}</b><span>${t('revenue_all')}</span></div></div>
    <h3 class="sec">${t('alerts')}</h3>
    ${al.length ? al.map(s => `<div class="card row"><div style="min-width:0"><b>${esc(s.name)}</b><div class="muted">${esc(subLine(s))}</div></div><div class="acts" style="margin:0"><span class="chip c-${esc(effStatus(s))}">${esc(t('st_' + effStatus(s)))}</span>
        <button class="btn btn-sm" data-act="ext" data-m="1" data-id="${esc(s.id)}">${t('m1')}</button><button class="btn btn-sm btn-primary" data-act="paynew" data-id="${esc(s.id)}">${t('pay')}</button></div></div>`).join('') : `<div class="empty card">${t('alerts_none')}</div>`}
    <h3 class="sec">${t('recent')}</h3>${logRows(S.logs.slice(0, 5))}`;
}

function viewSchools(el) {
  const q = S.q.trim().toLowerCase();
  const list = S.schools.filter(s => !q || (s.name + ' ' + (s.short_name || '') + ' ' + (s.admin_emails || '')).toLowerCase().includes(q));
  el.innerHTML = `<div class="bar"><input id="q" placeholder="${esc(t('search'))}" value="${esc(S.q)}"><button class="btn btn-primary" data-act="new">${t('newschool')}</button></div>
    ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty card">${t('none')}</div>`}`;
  const qi = $('#q'); qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; viewSchools(el); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
}

function viewPay(el) {
  el.innerHTML = `<div class="bar"><div class="card" style="flex:1;padding:12px 14px"><span class="muted">${t('revenue_all')}</span><div><b>${sumBy(S.pays)}</b></div></div><button class="btn btn-primary" data-act="paynew">${t('recpay')}</button></div>
    ${S.pays.length ? S.pays.map(p => `<div class="card row"><div style="min-width:0"><b>${Number(p.amount).toLocaleString('en-US', { maximumFractionDigits: 2 })} ${esc(p.currency)}</b> · ${esc(p.school_name)}
      <div class="muted">${fdate(p.paid_on)} · ${esc(t('m_' + (p.method === 'bank_transfer' ? 'bank' : p.method === 'mobile_money' ? 'mobile' : 'cash')))}${p.months ? ' · +' + esc(t('m_n', { n: p.months })) : ''}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
      <button class="btn btn-sm btn-danger" data-act="paydel" data-id="${esc(p.id)}">${t('del')}</button></div>`).join('') : `<div class="empty card">${t('no_pay')}</div>`}`;
}

function logRows(list) {
  return list.length ? list.map(l => `<div class="card row"><div style="min-width:0"><b>${esc(t('a_' + l.action))}</b>${l.school_name ? ' · ' + esc(l.school_name) : ''}${l.details ? `<div class="muted">${esc(l.details)}</div>` : ''}</div><div class="muted" style="text-align:right;white-space:nowrap">${ftime(l.created_at)}<br>${esc((l.actor_email || '').split('@')[0])}</div></div>`).join('') : `<div class="empty card">${t('no_log')}</div>`;
}
const viewLog = el => { el.innerHTML = logRows(S.logs); };

function card(s) {
  const st = effStatus(s);
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><h3>${esc(s.name)}</h3><div class="muted">${esc(s.plan)}${s.billing_cycle ? ' · ' + esc(t(s.billing_cycle === 'annual' ? 'annual' : 'monthly')) : ''}</div></div><span class="chip c-${esc(st)}">${esc(t('st_' + st))}</span></div>
    <div class="meta"><span><b>${s.students}</b> ${t('students')}</span><span><b>${s.teachers}</b> ${t('teachers')}</span></div>
    <div class="muted">${esc(subLine(s))}</div>
    <div class="muted" style="margin-top:4px">${t('admins')}: ${esc(s.admin_emails || '—')}</div>
    <div class="acts">
      <button class="btn btn-sm btn-primary" data-act="paynew" data-id="${esc(s.id)}">${t('pay')}</button>
      <button class="btn btn-sm" data-act="ext" data-m="1" data-id="${esc(s.id)}">${t('m1')}</button>
      <button class="btn btn-sm" data-act="ext" data-m="12" data-id="${esc(s.id)}">${t('y1')}</button>
      ${s.status === 'suspended' || st === 'expired' ? `<button class="btn btn-sm btn-primary" data-act="activate" data-id="${esc(s.id)}">${t('activate')}</button>` : `<button class="btn btn-sm btn-danger" data-act="suspend" data-id="${esc(s.id)}">${t('suspend')}</button>`}
      <button class="btn btn-sm" data-act="editschool" data-id="${esc(s.id)}">${t('edit')}</button>
      <button class="btn btn-sm" data-act="sub" data-id="${esc(s.id)}">${t('editsub')}</button>
      <button class="btn btn-sm" data-act="admin" data-id="${esc(s.id)}">${t('addadmin')}</button></div></div>`;
}

const byId = id => S.schools.find(s => s.id === id);
const toDateInput = iso => iso ? new Date(iso).toISOString().slice(0, 10) : '';
const endOfDay = d => d ? new Date(d + 'T23:59:59').toISOString() : null;
async function setSub(s, status, ends, plan, cycle) {
  const { error } = await sb.rpc('platform_set_subscription', { p_school: s.id, p_status: status, p_plan: plan ?? s.plan, p_billing_cycle: cycle === undefined ? (s.billing_cycle || '') : cycle, p_ends_at: ends });
  if (error) throw error;
}
function addMonths(iso, m) { const base = iso && new Date(iso) > new Date() ? new Date(iso) : new Date(); base.setMonth(base.getMonth() + m); return base.toISOString(); }

const ACT = {
  tab(el) { S.tab = el.dataset.id; draw(); },
  paynew(el) {
    const cur = el && el.dataset ? el.dataset.id : '';
    const sc = byId(cur);
    const m = modal(`<h2>${t('recpay')}</h2><form id="pf">
      <div class="fg"><label>${t('school')}</label><select name="school" required>${S.schools.map(x => `<option value="${esc(x.id)}" ${x.id === cur ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="row2"><div class="fg"><label>${t('amount')}</label><input name="amount" type="number" step="0.01" min="0.01" required></div>
        <div class="fg"><label>${t('currency')}</label><input name="cur" value="${esc((sc && sc.currency) || 'ETB')}" required></div></div>
      <div class="row2"><div class="fg"><label>${t('method')}</label><select name="method"><option value="cash">${t('m_cash')}</option><option value="bank_transfer">${t('m_bank')}</option><option value="mobile_money">${t('m_mobile')}</option></select></div>
        <div class="fg"><label>${t('paid_on')}</label><input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" required></div></div>
      <div class="fg"><label>${t('months')}</label><select name="months"><option value="0">${t('m_0')}</option>${[1, 3, 6, 12].map(n => `<option value="${n}" ${n === 1 ? 'selected' : ''}>${t('m_n', { n })}</option>`).join('')}</select></div>
      <div class="fg"><label>${t('note')}</label><input name="note"></div>
      <div class="mf"><button type="button" class="btn" data-x>${t('cancel')}</button><button class="btn btn-primary" id="pb">${t('save')}</button></div></form>`);
    m.querySelector('[data-x]').onclick = closeModal;
    m.querySelector('#pf').onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target);
      await busy(m.querySelector('#pb'), async () => {
        const { error } = await sb.rpc('platform_record_payment', { p_school: f.get('school'), p_amount: Number(f.get('amount')), p_currency: f.get('cur'), p_method: f.get('method'), p_paid_on: f.get('date'), p_months: Number(f.get('months')), p_note: f.get('note') });
        if (error) return toast(rpcErr(error)); closeModal(); toast(t('pay_saved')); await load();
      });
    };
  },
  async paydel(el) { if (!confirm(t('confirm_delpay'))) return; await busy(el, async () => { const { error } = await sb.rpc('platform_delete_payment', { p_id: el.dataset.id }); if (error) return toast(rpcErr(error)); toast(t('ok')); await load(); }); },
  editschool(el) {
    const s = byId(el.dataset.id);
    const m = modal(`<h2>${t('edit_school')}</h2><form id="ef">
      <div class="fg"><label>${t('n_name')}</label><input name="name" value="${esc(s.name)}" required minlength="2"></div>
      <div class="row2"><div class="fg"><label>${t('n_short')}</label><input name="short" value="${esc(s.short_name || '')}"></div>
        <div class="fg"><label>${t('n_type')}</label><select name="type">${[['primary_secondary', 't_ps'], ['primary', 't_p'], ['secondary', 't_s']].map(([v, k]) => `<option value="${v}" ${s.school_type === v ? 'selected' : ''}>${t(k)}</option>`).join('')}</select></div></div>
      <div class="row2"><div class="fg"><label>${t('phone')}</label><input name="phone" value="${esc(s.phone || '')}"></div><div class="fg"><label>${t('email')}</label><input name="email" type="email" value="${esc(s.email || '')}"></div></div>
      <div class="fg"><label>${t('address')}</label><input name="address" value="${esc(s.address || '')}"></div>
      <div class="row2"><div class="fg"><label>${t('n_lang')}</label><select name="lang"><option value="so" ${s.default_language === 'so' ? 'selected' : ''}>Soomaali</option><option value="en" ${s.default_language === 'en' ? 'selected' : ''}>English</option></select></div>
        <div class="fg"><label>${t('n_cur')}</label><input name="cur" value="${esc(s.currency || 'ETB')}"></div></div>
      <div class="mf"><button type="button" class="btn" data-x>${t('cancel')}</button><button class="btn btn-primary" id="eb">${t('save')}</button></div></form>`);
    m.querySelector('[data-x]').onclick = closeModal;
    m.querySelector('#ef').onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target);
      await busy(m.querySelector('#eb'), async () => { const { error } = await sb.rpc('platform_update_school', { p_school: s.id, p_name: f.get('name'), p_short: f.get('short'), p_phone: f.get('phone'), p_email: f.get('email'), p_address: f.get('address'), p_type: f.get('type'), p_language: f.get('lang'), p_currency: f.get('cur') }); if (error) return toast(rpcErr(error)); closeModal(); toast(t('saved')); await load(); });
    };
  },
  lang() { LANG = LANG === 'so' ? 'en' : 'so'; try { localStorage.setItem('pl_lang', LANG); } catch (e) { } draw(); },
  async out() { await sb.auth.signOut(); showLogin(); },
  new() {
    const m = modal(`<h2>${t('newschool')}</h2><form id="nf">
      <div class="fg"><label>${t('n_name')}</label><input name="name" required minlength="2"></div>
      <div class="row2"><div class="fg"><label>${t('n_short')}</label><input name="short"></div>
        <div class="fg"><label>${t('n_type')}</label><select name="type"><option value="primary_secondary">${t('t_ps')}</option><option value="primary">${t('t_p')}</option><option value="secondary">${t('t_s')}</option></select></div></div>
      <div class="row2"><div class="fg"><label>${t('n_lang')}</label><select name="lang"><option value="so">Soomaali</option><option value="en">English</option></select></div>
        <div class="fg"><label>${t('n_cur')}</label><input name="cur" value="ETB"></div></div>
      <div class="fg"><label>${t('n_email')}</label><input name="email" type="email" required><div class="hint">${t('n_email_h')}</div></div>
      <div class="row2"><div class="fg"><label>${t('n_status')}</label><select name="status"><option value="trial">${t('st_trial')}</option><option value="active">${t('st_active')}</option></select></div>
        <div class="fg"><label>${t('n_ends')}</label><input name="ends" type="date" value="${toDateInput(addMonths(null, 1))}"></div></div>
      <div class="mf"><button type="button" class="btn" data-x>${t('cancel')}</button><button class="btn btn-primary" id="nb">${t('create')}</button></div></form>`);
    m.querySelector('[data-x]').onclick = closeModal;
    m.querySelector('#nf').onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target);
      await busy(m.querySelector('#nb'), async () => {
        const { error } = await sb.rpc('platform_create_school', { p_name: f.get('name'), p_short: f.get('short'), p_type: f.get('type'), p_language: f.get('lang'), p_currency: (f.get('cur') || 'ETB').trim(), p_admin_email: f.get('email'), p_status: f.get('status'), p_ends_at: endOfDay(f.get('ends')) });
        if (error) return toast(rpcErr(error));
        closeModal(); toast(t('created')); await load();
      });
    };
  },
  async ext(el) { const s = byId(el.dataset.id); await busy(el, async () => { try { await setSub(s, s.status === 'trial' ? 'trial' : 'active', addMonths(s.subscription_ends_at, +el.dataset.m)); toast(t('ok')); await load(); } catch (e) { toast(rpcErr(e)); } }); },
  async activate(el) { const s = byId(el.dataset.id); await busy(el, async () => { try { const ends = s.subscription_ends_at && new Date(s.subscription_ends_at) > new Date() ? s.subscription_ends_at : addMonths(null, 1); await setSub(s, 'active', ends); toast(t('ok')); await load(); } catch (e) { toast(rpcErr(e)); } }); },
  async suspend(el) { const s = byId(el.dataset.id); if (!confirm(t('confirm_susp', { n: s.name }))) return; await busy(el, async () => { try { await setSub(s, 'suspended', s.subscription_ends_at); toast(t('ok')); await load(); } catch (e) { toast(rpcErr(e)); } }); },
  sub(el) {
    const s = byId(el.dataset.id);
    const m = modal(`<h2>${esc(s.name)}</h2><form id="sf">
      <div class="row2"><div class="fg"><label>${t('n_status')}</label><select name="status">${['active', 'trial', 'suspended', 'expired'].map(x => `<option value="${x}" ${s.status === x ? 'selected' : ''}>${t('st_' + x)}</option>`).join('')}</select></div>
        <div class="fg"><label>${t('plan')}</label><input name="plan" value="${esc(s.plan)}"></div></div>
      <div class="row2"><div class="fg"><label>${t('cycle')}</label><select name="cycle"><option value="">${t('none_opt')}</option><option value="monthly" ${s.billing_cycle === 'monthly' ? 'selected' : ''}>${t('monthly')}</option><option value="annual" ${s.billing_cycle === 'annual' ? 'selected' : ''}>${t('annual')}</option></select></div>
        <div class="fg"><label>${t('n_ends')}</label><input name="ends" type="date" value="${toDateInput(s.subscription_ends_at)}"></div></div>
      <div class="mf"><button type="button" class="btn" data-x>${t('cancel')}</button><button class="btn btn-primary" id="sb">${t('save')}</button></div></form>`);
    m.querySelector('[data-x]').onclick = closeModal;
    m.querySelector('#sf').onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target);
      await busy(m.querySelector('#sb'), async () => { try { await setSub(s, f.get('status'), endOfDay(f.get('ends')), f.get('plan'), f.get('cycle')); closeModal(); toast(t('saved')); await load(); } catch (er) { toast(rpcErr(er)); } });
    };
  },
  admin(el) {
    const s = byId(el.dataset.id);
    const m = modal(`<h2>${esc(s.name)}</h2><form id="af"><div class="fg"><label>${t('n_email')}</label><input name="email" type="email" required><div class="hint">${t('n_email_h')}</div></div>
      <div class="mf"><button type="button" class="btn" data-x>${t('cancel')}</button><button class="btn btn-primary" id="ab">${t('save')}</button></div></form>`);
    m.querySelector('[data-x]').onclick = closeModal;
    m.querySelector('#af').onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target);
      await busy(m.querySelector('#ab'), async () => { const { error } = await sb.rpc('platform_add_admin', { p_school: s.id, p_email: f.get('email') }); if (error) return toast(rpcErr(error)); closeModal(); toast(t('added')); await load(); });
    };
  }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
boot();
</script>
</body>
</html>
