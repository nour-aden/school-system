<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>School</title>
<meta name="theme-color" content="#0B5D5E">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">

<style>
:root{--navy:#0B5D5E;--navy2:#084A4B;--blue:#0E7C7B;--sky:#E3F0EE;--sky2:#F4F7F6;--yellow:#F2B01E;--ink:#0E2F30;--muted:#4F6667;--line:#D5E0DE;--white:#fff;
--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;background:#fff;color:var(--ink);font:16px/1.6 var(--body)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--navy)}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:8px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar */
.top{background:var(--navy);color:#fff;font-size:.88rem}
.top .wrap{display:flex;align-items:center;gap:6px 22px;padding-block:8px;flex-wrap:wrap}
.top a,.top span.c{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#fff}
.top .i{color:var(--yellow);font-size:1.1em}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;background:var(--yellow);color:var(--navy);font:700 .92rem var(--body);padding:8px 16px;cursor:pointer;text-decoration:none;min-height:38px}
.pill:hover{filter:brightness(1.05)}
@media (max-width:760px){.top .hide-m{display:none}}
/* header */
.hd{background:#fff;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 var(--line)}
.hd .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.logo .lg{width:52px;height:52px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex:none;overflow:hidden;color:var(--navy);font-size:26px}
.logo .lg img{width:100%;height:100%;object-fit:cover}
.logo b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.05;color:var(--navy)}
.logo small{display:block;font-style:italic;color:var(--blue);font-weight:500;font-size:.85rem}
.hd nav{margin-left:auto;display:flex;gap:2px;align-items:center}
.hd nav a.l{padding:9px 14px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.95rem;color:var(--navy)}
.hd nav a.l:hover,.hd nav a.l.on{background:var(--navy);color:#fff}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-left:8px}
.lang button{font:700 .78rem var(--body);background:transparent;color:var(--navy);border:0;padding:8px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.burger{display:none;background:#fff;border:1.5px solid var(--line);border-radius:12px;width:44px;height:44px;cursor:pointer;color:var(--navy);align-items:center;justify-content:center;margin-left:auto}
.burger svg{width:22px;height:22px}
@media (max-width:900px){.burger{display:inline-flex}.hd .wrap{position:relative}.hd nav{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px 16px;flex-direction:column;align-items:stretch;margin:0;box-shadow:0 12px 24px rgba(11,93,94,.12)}.hd nav.open{display:flex}.hd nav a.l{padding:13px 12px;border-radius:12px}.lang{align-self:flex-start;margin:8px 0 0}}

.hero{position:relative;background:linear-gradient(100deg,#fff 0%,var(--sky2) 45%,var(--sky) 100%);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:8px;padding-block:clamp(28px,5vw,56px) clamp(60px,8vw,96px)}
.hero .tag{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:700;border-radius:99px;padding:7px 18px;font-size:.92rem}
.hero h1{font-size:clamp(2.2rem,6vw,3.9rem);font-weight:800;margin:16px 0 0;color:var(--navy)}
.lvl{display:inline-flex;margin-top:14px;align-items:center;gap:12px}
.lvl::before,.lvl::after{content:"";width:38px;height:3px;background:var(--yellow);border-radius:3px}
.lvl span{background:var(--navy);color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,3vw,1.7rem);padding:6px 24px;border-radius:99px}
.hero p.lead{margin-top:16px;max-width:30em;font-style:italic;font-size:1.12rem;color:var(--navy)}
.hero p.sub{margin-top:6px;color:#B26A00;font-weight:700}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:700 1rem var(--body);border-radius:99px;padding:13px 24px;text-decoration:none;border:2px solid transparent;cursor:pointer;min-height:48px}
.btn.y{background:var(--yellow);color:var(--navy)}
.btn.n{background:var(--navy);color:#fff}
.btn.o{border-color:var(--navy);color:var(--navy);background:#fff}

.heroimg{align-self:stretch;min-height:300px;background:var(--sky) center/cover no-repeat;border-radius:28px 0 0 28px;position:relative;display:grid;place-items:center;color:var(--navy);margin-right:calc(-1 * max(16px,(100vw - 1120px)/2))}
.heroimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(244,247,246,.85),rgba(244,247,246,0) 35%);border-radius:inherit}
.heroimg .i{font-size:96px;opacity:.25;position:relative}
.wave{position:absolute;left:0;width:100%;bottom:-1px;height:54px;pointer-events:none}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-bottom:70px}.heroimg{margin-right:0;border-radius:24px;min-height:240px}}
/* features */
.feat{margin-top:-30px;position:relative;z-index:2}
.feat .box{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(11,93,94,.08);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.feat .it{padding:18px 14px;text-align:center;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.feat .it:first-child{border-left:0}
.feat .ic{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px}
.feat b{font-size:.95rem;line-height:1.25;color:var(--navy)}

.eyebrow{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy)}
.eyebrow::before{content:"";width:34px;height:3px;background:var(--yellow);border-radius:3px}

.about h2{font-size:clamp(1.8rem,4vw,2.7rem);margin:8px 0 14px}
.about p{color:var(--muted);font-size:1.05rem}
.about .btn{margin-top:20px}

.sec-t{text-align:center;margin-bottom:26px}
.sec-t h2{display:inline-flex;align-items:center;gap:16px;font-size:clamp(1.6rem,3.6vw,2.2rem)}
.sec-t h2::before,.sec-t h2::after{content:"";width:clamp(26px,8vw,110px);height:3px;background:var(--yellow);border-radius:3px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px}
.cl{background:var(--navy);color:#fff;border-radius:18px;padding:16px 8px;text-align:center;font-family:var(--display);font-weight:700}
.cl small{display:block;font-family:var(--body);font-weight:600;font-size:.8rem;opacity:.9}
.cl b{font-size:1.7rem;line-height:1.1;display:block}
.cl.y{background:var(--yellow);color:var(--navy)}
.cl .i{font-size:22px;margin-bottom:4px;display:block;margin-inline:auto}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 6px 18px rgba(11,93,94,.06)}
.card .n{width:38px;height:38px;border-radius:12px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.card p{color:var(--muted);margin-top:8px;font-size:.97rem}
.alt{background:var(--sky2)}
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fig{margin:0}.fig img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block;border:1px solid var(--line)}
.fig figcaption{margin-top:8px;color:var(--muted);font-size:.95rem}
.quote p{color:var(--ink)}.quote b{display:block;margin-top:12px;font-size:.92rem;color:var(--navy)}
/* footer */
.join{background:var(--navy);color:#fff;position:relative;margin-top:40px;padding-top:30px}
.join .wv{position:absolute;left:0;width:100%;top:-34px;height:36px}
.join .wrap{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:26px 34px;padding-block:26px 30px}
.join h3{color:var(--yellow);font-size:1.15rem;margin-bottom:12px}
.join .big{font-family:var(--display);font-style:italic;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.15;color:#fff}
.join .big+p{margin-top:8px;color:#CFE3E1}
.join .ln{display:flex;gap:10px;align-items:flex-start;margin:8px 0;color:#fff;text-decoration:none;font-size:.97rem;word-break:break-word}
.join .ln .i{color:var(--yellow);font-size:1.15em;margin-top:3px}
.soc{display:flex;gap:12px}
.soc a{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:20px}
.cr{background:var(--navy2);color:#CFE3E1;font-size:.88rem}
.cr .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding-block:16px}
.cr a{color:var(--yellow);text-decoration:none;font-weight:600}
@media (max-width:820px){.join .wrap{grid-template-columns:1fr}}
dialog{border:0;border-radius:22px;background:#fff;color:var(--ink);padding:24px;max-width:min(420px,calc(100vw - 32px));width:100%;box-shadow:0 30px 80px rgba(8,74,75,.4)}
dialog::backdrop{background:rgba(8,74,75,.6)}
dialog h2{font-size:1.3rem;margin-bottom:14px}
.pick{display:block;text-decoration:none;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;background:var(--sky2)}
.pick:hover{border-color:var(--navy)}
.pick b{display:block;color:var(--navy)}.pick span{color:var(--muted);font-size:.9rem}
.state{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
.state h1{font-size:1.8rem;margin-bottom:8px}.state p{color:var(--muted);max-width:28em;margin:0 auto 18px}
.spin{width:34px;height:34px;border:3px solid var(--sky);border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>

  <header class="hd"><div class="wrap">
    <a class="logo" href="#top"><span class="lg">${logo ? `<img src="${esc(logo)}" alt="">` : ic(IC.cap)}</span><span><b>${esc(d.short_name || n)}</b>${motto ? `<small>${esc(motto)}</small>` : ''}</span></a>
    <button class="burger" type="button" id="burger" aria-label="${tt('menu')}" aria-expanded="false">${ic(IC.menu)}</button>
    <nav id="nav"><a class="l on" href="#top">${tt('home')}</a><a class="l" href="#about">${tt('about')}</a><a class="l" href="#classes">${tt('classes')}</a>${gal.length ? `<a class="l" href="#gallery">${tt('gallery')}</a>` : ''}<a class="l" href="#contact">${tt('contact')}</a>
      <div class="lang"><button type="button" data-l="so" aria-pressed="${L === 'so'}">SO</button><button type="button" data-l="en" aria-pressed="${L === 'en'}">EN</button></div></nav>
  </div></header>
  <main id="top">
  <div class="hero"><div class="wrap">
    <div><span class="tag">${esc(txt('tagline', tt('tagline')))}</span>
      <h1>${esc(n)}</h1>
      ${levels ? `<div class="lvl"><span>${esc(levels)}</span></div>` : ''}
      <p class="lead">${esc(txt('intro', fill(tt('intro'), n)))}</p>
      ${txt('headline', '') ? `<p class="sub">${esc(txt('headline', ''))}</p>` : ''}
      <div class="cta"><a class="btn y" href="${esc(applyHref)}"${wa ? ' target="_blank" rel="noopener"' : ''}>${ic(IC.cap)} ${tt('apply')} ${ic(IC.arrow)}</a><a class="btn o" href="#about">${tt('explore')}</a></div></div>
    <div class="heroimg"${hero ? ` style="background-image:url('${esc(hero)}')"` : ''}>${hero ? '' : ic(IC.cap)}</div>
    <svg class="wave" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60V38C200 10 400 4 640 22s400 22 560-6v44z" fill="#fff"/><path d="M0 40C200 14 400 8 640 26s400 20 560-8" fill="none" stroke="#F2B01E" stroke-width="4"/></svg>
  </div></div>
  <div class="feat"><div class="wrap"><div class="box">${feats.map((f, i) => `<div class="it"><span class="ic">${ic(IC[FEAT[i]])}</span><b>${esc(f)}</b></div>`).join('')}</div></div></div>
  <section id="about"><div class="wrap about"><div><div class="eyebrow">${tt('about')}</div><h2>${esc(n)}</h2><p>${esc(txt('about', fill(tt('about_d'), n))).replace(/\n/g, '<br>')}</p><a class="btn n" href="#contact">${tt('more')} ${ic(IC.arrow)}</a></div>
    <div class="pic">${abt ? `<img src="${esc(abt)}" alt="">` : (logo ? `<img src="${esc(logo)}" alt="" style="object-fit:contain;padding:28px">` : ic(IC.cap).replace('class="i"', 'class="i" style="font-size:80px;color:#0B5D5E;opacity:.25"'))}</div></div></section>
  ${cls.length ? `<section id="classes" class="alt"><div class="wrap"><div class="sec-t"><h2>${tt('classes')}</h2></div><div class="classes">${cls.map(classCard).join('')}</div></div></section>` : ''}
  ${progs.length ? `<section><div class="wrap"><div class="cards">${progs.map((p, i) => `<div class="card"><div class="n">${i + 1}</div><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p></div>`).join('')}</div></div></section>` : ''}
  ${gal.length ? `<section id="gallery"><div class="wrap"><div class="sec-t"><h2>${tt('gallery')}</h2></div><div class="gal">${gal.map(g => `<figure class="fig"><img loading="lazy" src="${esc(g.u)}" alt="${esc(g.c)}">${g.c ? `<figcaption>${esc(g.c)}</figcaption>` : ''}</figure>`).join('')}</div></div></section>` : ''}
  ${quotes.length ? `<section class="alt"><div class="wrap"><div class="sec-t"><h2>${tt('words')}</h2></div><div class="cards">${quotes.map(q => `<div class="card quote"><p>“${esc(q.text)}”</p><b>${esc(q.name || '')}${q.role ? ` · ${esc(q.role)}` : ''}</b></div>`).join('')}</div></div></section>` : ''}
  </main>
  <footer id="contact"><div class="join"><svg class="wv" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40V22C220 0 420 0 640 14s380 14 560-6v32z" fill="#0B5D5E"/><path d="M0 22C220 0 420 0 640 14s380 14 560-6" fill="none" stroke="#F2B01E" stroke-width="4"/></svg>
    <div class="wrap">
      <div><div class="big">${tt('join_h')}</div><p>${tt('join_d')}</p></div>
      <div><h3>${tt('contact')}</h3>
        ${d.phone ? `<a class="ln" href="tel:${esc(String(d.phone).replace(/\s/g, ''))}">${ic(IC.phone)} ${esc(d.phone)}</a>` : ''}
        ${wa ? `<a class="ln" href="https://wa.me/${wa}" target="_blank" rel="noopener">${ic(IC.phone)} WhatsApp +${wa}</a>` : ''}
        ${d.email ? `<a class="ln" href="mailto:${esc(d.email)}">${ic(IC.mail)} ${esc(d.email)}</a>` : ''}
        ${d.address ? `<span class="ln">${ic(IC.pin)} ${esc(d.address)}</span>` : ''}</div>
      <div>${soc.length ? `<h3>${tt('follow')}</h3><div class="soc">${soc.map(([k, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${k}">${ic(IC[k])}</a>`).join('')}</div>` : `<h3>${tt('admin_btn')}</h3><button class="pill" type="button" data-login>${ic(IC.user)} ${tt('admin_btn')}</button>`}</div>
    </div>
    <div class="cr"><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(n)}. ${tt('rights')}</span><span><a href="${BASE}teacher_portal.html">${tt('teacher')}</a> &nbsp;·&nbsp; <a href="${BASE}admin.html">${tt('staff')}</a></span></div></div>
  </div></footer>
  <dialog id="dlg"><h2>${tt('who')}</h2><a class="pick" href="${BASE}admin.html"><b>${tt('admin_l')}</b><span>${tt('admin_d')}</span></a><a class="pick" href="${BASE}teacher_portal.html"><b>${tt('teach_l')}</b><span>${tt('teach_d')}</span></a><button class="btn o" type="button" id="dlg-x" style="width:100%">${tt('close')}</button></dialog>`;
  const bg = $('#burger'), nv = $('#nav'); bg.addEventListener('click', () => { const o = nv.classList.toggle('open'); bg.setAttribute('aria-expanded', o); }); nv.querySelectorAll('a.l').forEach(a => a.addEventListener('click', () => nv.classList.remove('open')));
  const dlg = $('#dlg'); document.querySelectorAll('[data-login]').forEach(b => b.addEventListener('click', () => dlg.showModal ? dlg.showModal() : dlg.setAttribute('open', ''))); $('#dlg-x').addEventListener('click', () => dlg.close ? dlg.close() : dlg.removeAttribute('open'));
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.l; try { localStorage.setItem('site-lang', LANG); } catch (e) {} render(); }));
}

(async function () {
  if (!slug) return state(tt('not_found'), tt('not_found_d'), true);
  if (!window.supabase) return state(tt('not_found'), tt('err'), false);
  try {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    const { data, error } = await sb.rpc('public_school_site', { p_slug: slug });
    if (error) throw error;
    if (!data) return state(tt('not_found'), tt('not_found_d'), true);
    DATA = data;
    let saved = null; try { saved = localStorage.getItem('site-lang'); } catch (e) {}
    LANG = (saved === 'en' || saved === 'so') ? saved : (data.lang === 'en' ? 'en' : 'so');
    render();
  } catch (e) { state('School', tt('err'), false); }
})();
</script>
</body>
</html>
