<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>School</title>
<meta name="theme-color" content="#0B5D5E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F4F7F6;--surface:#fff;--ink:#0E2F30;--muted:#4F6667;--line:#D5E0DE;--brand:#0B5D5E;--brand-ink:#fff;--soft:#E3F0EE;--accent:#F2B01E;--accent-ink:#2A1D00;
--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1B1C;--surface:#10292A;--ink:#E8F2F0;--muted:#9DB6B4;--line:#244041;--brand:#5CC7C1;--brand-ink:#04201F;--soft:#143536;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(1.55rem,3.6vw,2.2rem)}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.05rem;min-width:0}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none;overflow:hidden}
.logo i img{width:100%;height:100%;object-fit:cover}
.logo i svg{width:20px;height:20px;fill:none;stroke:var(--brand-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.bar nav a.l{padding:8px 10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.93rem;border-radius:8px}
.bar nav a.l:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:600 .82rem var(--body);background:transparent;color:var(--muted);border:0;padding:8px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 1rem var(--body);border-radius:12px;padding:12px 20px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;min-height:46px}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.main:hover{filter:brightness(1.05)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.light{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.08)}
@media (max-width:820px){.bar nav a.l{display:none}}
/* hero */
.hero{position:relative;color:#fff;background:linear-gradient(135deg,#0A2B2C,#0B5D5E 70%,#0E7C7B);background-size:cover;background-position:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,43,44,.88),rgba(10,43,44,.45))}
.hero .wrap{position:relative;padding-block:clamp(48px,9vw,110px)}
.hero .tag{display:inline-block;background:rgba(242,176,30,.18);color:#F2B01E;border:1px solid rgba(242,176,30,.5);border-radius:99px;padding:5px 14px;font-size:.85rem;font-weight:600}
.hero h1{font-family:var(--display);font-size:clamp(2.1rem,6vw,3.6rem);font-weight:700;margin:16px 0 0;max-width:15em}
.hero p.lead{margin-top:16px;max-width:36em;color:rgba(255,255,255,.88);font-size:1.1rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
/* sections */
section{padding-block:clamp(40px,6vw,76px)}
.head{text-align:center;max-width:40em;margin:0 auto 32px}
.head p{color:var(--muted);margin-top:10px}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(24px,5vw,56px);align-items:center}
.about p{color:var(--muted);font-size:1.05rem}
.about .pic{aspect-ratio:4/3;border-radius:18px;background:var(--soft);overflow:hidden;display:grid;place-items:center}
.about .pic img{width:100%;height:100%;object-fit:cover}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.card .n{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;margin-bottom:12px}
.card p{color:var(--muted);margin-top:8px;font-size:.97rem}
.alt{background:var(--soft)}
.gal{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.quote p{font-size:1rem;color:var(--ink)}
.quote b{display:block;margin-top:12px;font-size:.92rem}
.contact{display:grid;gap:12px;max-width:560px;margin:0 auto}
.contact a,.contact div.r{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none}
.contact small{display:block;color:var(--muted);font-size:.8rem}
footer{background:#0A2B2C;color:#CFE3E1;padding-block:34px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:center}
footer a{color:#CFE3E1;text-decoration:none;border-bottom:1px solid rgba(207,227,225,.35)}
footer small{opacity:.75}
.state{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
.state h1{font-size:1.8rem;margin-bottom:8px}
.state p{color:var(--muted);max-width:28em;margin:0 auto 18px}
.spin{width:34px;height:34px;border:3px solid var(--soft);border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;margin:0 auto}
@keyframes s{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="root"><div class="state"><div class="spin" aria-label="Loading"></div></div></div>
<script>
const SUPABASE_URL = "https://bfozghbwpyspotpblcyr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AkI4NAyrbLlnvmMiAfPaUQ_vO6C8UqJ";
const BASE = (() => { const p = location.pathname.split('/').filter(Boolean); return /\.github\.io$/.test(location.hostname) && p.length ? '/' + p[0] + '/' : '/'; })();
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';
const slug = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');

const T = {
  so: { home: 'Hoyga', about: 'Nagu saabsan', programs: 'Barnaamijyada', why: 'Sababta loo doorto', gallery: 'Sawirro', words: 'Waxay yiraahdeen', contact: 'Nala xiriir',
    apply: 'Is-diiwaangeli', call: 'Nagu soo wac', login: 'Gelitaanka', staff: 'Maamul / Macallin', teacher: 'Macallin', powered: 'Waxaa shaqeeya School System',
    tagline: 'Waxbarasho tayo leh, mustaqbal iftiin leh', intro: 'Ku soo biir {n}, halkaas oo ardayda lagu barbaariyo aqoon, anshax iyo kalsooni.',
    about_t: 'Ku saabsan {n}', about_d: '{n} waa dugsi u heellan tayada waxbarashada, anshaxa iyo horumarka ardayda.',
    p1: 'Dugsiga Hoose', p1d: 'Aasaas adag oo akhriska, qoraalka iyo xisaabta.', p2: 'Dugsiga Sare', p2d: 'Diyaarin ardayda imtixaannada iyo waxbarashada sare.', p3: 'Dhaqdhaqaaqyada', p3d: 'Isboorti iyo hawlo dhaqameed oo kobciya hibada.',
    w1: 'Macallimiin khibrad leh', w1d: 'Kooxda waxbarista waxay ku daryaan xirfad iyo daryeel.', w2: 'Anshax iyo qiyam', w2d: 'Deegaan nabdoon oo anshaxa lagu dhiso.', w3: 'La socodka horumarka', w3d: 'Waalidku wuxuu la socdaa natiijada ilmihiisa.', w4: 'Deegaan ammaan ah', w4d: 'Ardayda iyo macallimiinta ammaankooda waa mudnaan.',
    not_found: 'Dugsigan lama helin', not_found_d: 'Hubi linkiga ama la xiriir dugsiga.', back: 'Ku laabo bogga hore', err: 'Wax khalad ah ayaa dhacay. Dib isku day.' },
  en: { home: 'Home', about: 'About', programs: 'Programs', why: 'Why choose us', gallery: 'Gallery', words: 'What they say', contact: 'Contact',
    apply: 'Apply now', call: 'Call us', login: 'Sign in', staff: 'Admin / Staff', teacher: 'Teacher', powered: 'Powered by School System',
    tagline: 'Quality education, a bright future', intro: 'Join {n}, where students grow in knowledge, character and confidence.',
    about_t: 'About {n}', about_d: '{n} is committed to quality teaching, good character and student progress.',
    p1: 'Primary School', p1d: 'A strong foundation in reading, writing and maths.', p2: 'Secondary School', p2d: 'Preparing students for exams and higher education.', p3: 'Activities', p3d: 'Sports and cultural activities that grow talent.',
    w1: 'Experienced teachers', w1d: 'Our teaching team brings skill and care.', w2: 'Character and values', w2d: 'A safe environment that builds good conduct.', w3: 'Progress tracking', w3d: 'Parents follow their child\'s results.', w4: 'Safe environment', w4d: 'The safety of students and teachers comes first.',
    not_found: 'School not found', not_found_d: 'Check the link or contact the school.', back: 'Back to home', err: 'Something went wrong. Try again.' }
};
let LANG = 'so', DATA = null;
const fill = (s, n) => String(s).replace(/\{n\}/g, n);
const tt = k => T[LANG][k] || T.en[k] || k;

function ic(p) { return `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`; }
const CAP = ic('<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>');

function state(h, d, withBack) { $('#root').innerHTML = `<div class="state"><div><h1>${esc(h)}</h1><p>${esc(d)}</p>${withBack ? `<a class="btn main" href="${BASE}">${esc(tt('back'))}</a>` : ''}</div></div>`; }

function render() {
  const d = DATA, c = d.content || {}, n = d.name, L = LANG, pick = (o, k) => (o && (o[k + '_' + L] || o[k])) || '';
  const txt = (k, def) => (c[k + '_' + L] || c[k] || def);
  const hero = safeUrl(c.hero_image), logo = safeUrl(d.logo);
  let wa = String(c.whatsapp || d.phone || '').replace(/\D/g, '');
  if (/^0\d{9}$/.test(wa)) wa = '251' + wa.slice(1); else if (/^[79]\d{8}$/.test(wa)) wa = '251' + wa;
  const applyHref = wa ? `https://wa.me/${wa}` : (d.email ? `mailto:${d.email}` : '#contact');
  const progs = [0, 1, 2].map(i => { const p = (c.programs || [])[i] || {}; return { t: pick(p, 'title') || tt('p' + (i + 1)), d: pick(p, 'text') || tt('p' + (i + 1) + 'd') }; });
  const whys = [0, 1, 2, 3].map(i => { const p = (c.why || [])[i] || {}; return { t: pick(p, 'title') || tt('w' + (i + 1)), d: pick(p, 'text') || tt('w' + (i + 1) + 'd') }; });
  const quotes = (c.testimonials || []).filter(q => q && q.text);
  const gal = (c.gallery || []).map(safeUrl).filter(Boolean);
  document.documentElement.lang = L;
  document.title = n;
  $('#root').innerHTML = `
  <header class="bar"><div class="wrap">
    <a class="logo" href="#top"><i>${logo ? `<img src="${esc(logo)}" alt="">` : CAP}</i><span>${esc(d.short_name || n)}</span></a>
    <nav><a class="l" href="#about">${tt('about')}</a><a class="l" href="#programs">${tt('programs')}</a><a class="l" href="#why">${tt('why')}</a>${gal.length ? `<a class="l" href="#gallery">${tt('gallery')}</a>` : ''}<a class="l" href="#contact">${tt('contact')}</a>
      <div class="lang"><button type="button" data-l="so" aria-pressed="${L === 'so'}">SO</button><button type="button" data-l="en" aria-pressed="${L === 'en'}">EN</button></div></nav>
  </div></header>
  <main id="top">
  <div class="hero"${hero ? ` style="background-image:url('${esc(hero)}')"` : ''}><div class="wrap">
    <span class="tag">${esc(txt('tagline', tt('tagline')))}</span>
    <h1>${esc(n)}</h1>
    <p class="lead">${esc(txt('intro', fill(tt('intro'), n)))}</p>
    <div class="cta"><a class="btn main" href="${esc(applyHref)}"${wa ? ' target="_blank" rel="noopener"' : ''}>${tt('apply')}</a><a class="btn light" href="#contact">${tt('contact')}</a></div>
  </div></div>
  <section id="about"><div class="wrap about"><div><div class="eyebrow">${tt('about')}</div><h2 style="margin:8px 0 14px">${esc(fill(tt('about_t'), n))}</h2><p>${esc(txt('about', fill(tt('about_d'), n))).replace(/\n/g, '<br>')}</p></div>
    ${hero || logo ? `<div class="pic">${hero ? `<img src="${esc(hero)}" alt="">` : `<img src="${esc(logo)}" alt="" style="object-fit:contain;padding:24px">`}</div>` : ''}</div></section>
  <section id="programs" class="alt"><div class="wrap"><div class="head"><div class="eyebrow">${tt('programs')}</div><h2>${tt('programs')}</h2></div>
    <div class="grid">${progs.map((p, i) => `<div class="card"><div class="n">${i + 1}</div><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p></div>`).join('')}</div></div></section>
  <section id="why"><div class="wrap"><div class="head"><div class="eyebrow">${tt('why')}</div><h2>${tt('why')}</h2></div>
    <div class="grid">${whys.map((p, i) => `<div class="card"><div class="n">${i + 1}</div><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p></div>`).join('')}</div></div></section>
  ${gal.length ? `<section id="gallery" class="alt"><div class="wrap"><div class="head"><h2>${tt('gallery')}</h2></div><div class="gal">${gal.map(u => `<img loading="lazy" src="${esc(u)}" alt="">`).join('')}</div></div></section>` : ''}
  ${quotes.length ? `<section><div class="wrap"><div class="head"><h2>${tt('words')}</h2></div><div class="grid">${quotes.map(q => `<div class="card quote"><p>“${esc(q.text)}”</p><b>${esc(q.name || '')}${q.role ? ` <span style="font-weight:400;color:var(--muted)">· ${esc(q.role)}</span>` : ''}</b></div>`).join('')}</div></div></section>` : ''}
  <section id="contact"${gal.length || quotes.length ? '' : ' class="alt"'}><div class="wrap"><div class="head"><h2>${tt('contact')}</h2></div><div class="contact">
    ${d.phone ? `<a href="tel:${esc(String(d.phone).replace(/\s/g, ''))}"><div><small>${tt('call')}</small>${esc(d.phone)}</div></a>` : ''}
    ${wa ? `<a href="https://wa.me/${wa}" target="_blank" rel="noopener"><div><small>WhatsApp</small>+${wa}</div></a>` : ''}
    ${d.email ? `<a href="mailto:${esc(d.email)}"><div><small>Email</small>${esc(d.email)}</div></a>` : ''}
    ${d.address ? `<div class="r"><div><small>${L === 'so' ? 'Cinwaan' : 'Address'}</small>${esc(d.address)}</div></div>` : ''}
  </div></div></section>
  </main>
  <footer><div class="wrap"><div><b>${esc(n)}</b><br><small>${tt('powered')}</small></div>
    <div><a href="${BASE}teacher_portal.html">${tt('teacher')}</a> &nbsp; <a href="${BASE}admin.html">${tt('staff')}</a></div></div></footer>`;
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.l; try { localStorage.setItem('site-lang', LANG); } catch (e) {} render(); }));
}

(async function () {
  if (!slug) return state(tt('not_found'), tt('not_found_d'), true);
  if (!window.supabase) return state(tt('not_found'), tt('err'), false);
  try {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    const { data, error } = await sb.rpc('public_school_site', { p_slug: slug });
    if (error) throw error;
    if (!data) return state(tt('not_found'), tt('not_found_d'), true);
    DATA = data;
    let saved = null; try { saved = localStorage.getItem('site-lang'); } catch (e) {}
    LANG = (saved === 'en' || saved === 'so') ? saved : (data.lang === 'en' ? 'en' : 'so');
    render();
  } catch (e) { state('School', tt('err'), false); }
})();
</script>
</body>
</html>
