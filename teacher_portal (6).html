<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2557">
<title>Teacher Portal</title>
<meta name="description" content="Teacher Portal — attendance, marks and students.">
<script>
(function(){function show(m){var d=document.getElementById('fatal');if(!d){d=document.createElement('div');d.id='fatal';d.style.cssText='position:fixed;z-index:999;left:12px;right:12px;bottom:12px;background:#fdecec;color:#991b1b;border:1px solid #f5b5b5;border-radius:10px;padding:12px 14px;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap';document.body.appendChild(d);}d.textContent='Error: '+m;}
window.addEventListener('error',function(e){show((e.message||'script error')+(e.filename?' ('+String(e.filename).split('/').pop()+':'+e.lineno+')':''));});
window.addEventListener('unhandledrejection',function(e){show((e.reason&&e.reason.message)||String(e.reason));});
window.addEventListener('load',function(){if(!window.supabase)show('Supabase library did not load (check internet / ad-blocker).');});})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --surface:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e5e9f2;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eaf1ff; --navy:#0f2557;
  --green:#15803d; --green-l:#e6f6ec; --red:#dc2626; --red-l:#fdecec; --amber:#b45309; --amber-l:#fff3dc; --slate-l:#eef1f6;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
[hidden]{display:none!important}
.muted{color:var(--ink2)} .small{font-size:12.5px} .num{text-align:right;font-variant-numeric:tabular-nums} .center{text-align:center}
.ic{flex:none;vertical-align:middle}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200}
.spinner{width:34px;height:34px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--slate-l)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff} .btn-primary:hover{background:var(--blue-d)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff} .btn-danger:hover{background:#b91c1c}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgba(120,120,120,.4);border-top-color:#555;border-radius:50%;animation:spin .7s linear infinite}
.btn-primary.busy::after{border-color:rgba(255,255,255,.5);border-top-color:#fff}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;cursor:pointer}
.icon-btn:hover{background:var(--slate-l)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid #d5dbe8;border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
input:disabled,select:disabled{background:var(--slate-l);color:var(--ink2)}
label.f{display:block;font-weight:600;font-size:13px;margin:0 0 5px}
.fg{margin-bottom:14px}

/* layout */
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .icon-btn{color:#fff} .topbar .icon-btn:hover{background:rgba(255,255,255,.12)}
.avatar{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:13px;flex:none}
.langsw{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:9px;overflow:hidden}
.langsw button{background:transparent;border:0;color:#fff;padding:6px 10px;font-weight:600;font-size:12.5px;cursor:pointer;opacity:.75}
.langsw button.on{background:rgba(255,255,255,.22);opacity:1}
.langsw.dark{border-color:var(--line)} .langsw.dark button{color:var(--ink)} .langsw.dark button.on{background:var(--blue-l);color:var(--blue)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;color:var(--ink2);font-size:11.5px;font-weight:600}
.tabbar a.on{color:var(--blue)}
main{max-width:980px;margin:0 auto;padding:16px 14px 96px}
@media(min-width:820px){
  .tabbar{position:static;max-width:980px;margin:14px auto 0;border:1px solid var(--line);border-radius:12px;grid-template-columns:repeat(4,max-content);gap:6px;padding:6px;box-shadow:var(--shadow)}
  .tabbar a{flex-direction:row;gap:8px;padding:9px 16px;font-size:14px;border-radius:9px}
  .tabbar a.on{background:var(--blue-l)}
  main{padding-bottom:40px}
}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.page-head h1{font-size:21px} .page-head p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px} .gap{margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;line-height:1.1} .stat span{color:var(--ink2);font-size:13px}
.row2{display:grid;gap:10px;grid-template-columns:1fr} @media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.row3{display:grid;gap:10px;grid-template-columns:1fr} @media(min-width:720px){.row3{grid-template-columns:2fr 1fr 1fr}}
.section-title{font-weight:700;font-size:14px;margin:18px 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.list-item:last-child{border-bottom:0} .list-item:hover{background:var(--slate-l)}
.list-item .grow{flex:1;min-width:0} .list-item b{display:block}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--slate-l);color:var(--ink2);white-space:nowrap}
.b-green{background:var(--green-l);color:var(--green)} .b-red{background:var(--red-l);color:var(--red)} .b-amber{background:var(--amber-l);color:var(--amber)} .b-blue{background:var(--blue-l);color:var(--blue)}
.empty{padding:34px 16px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:8px}
.alert{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.alert.err{background:var(--red-l);color:#991b1b;border:1px solid #f5b5b5}
.alert.warn{background:var(--amber-l);color:#7c3f06;border:1px solid #f1d29a}
.alert.info{background:var(--blue-l);color:#1e3a8a;border:1px solid #c6d8fb}
.alert.ok{background:var(--green-l);color:#14532d;border:1px solid #b6e0c4}
.skel{height:56px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 37%,#eef1f6 63%);background-size:400% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.subtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.subtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* attendance */
.sumbar{position:sticky;top:58px;z-index:20;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px}
.pill{display:inline-flex;gap:5px;align-items:center;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
.att-row{padding:12px 14px;border-bottom:1px solid var(--line)} .att-row:last-child{border-bottom:0}
.att-name{display:flex;align-items:center;gap:10px;margin-bottom:9px} .att-name b{display:block;line-height:1.25} .att-no{width:26px;text-align:right;color:var(--ink3);font-size:12.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:42px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.seg button.on[data-s=present]{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on[data-s=absent]{background:var(--red);border-color:var(--red);color:#fff}
.seg button.on[data-s=late]{background:#d97706;border-color:#d97706;color:#fff}
.seg button.on[data-s=excused]{background:var(--blue);border-color:var(--blue);color:#fff}

/* marks */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--slate-l);text-align:left;padding:9px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th.num,.tbl td.num{text-align:right}
.mark-in{width:92px;text-align:right;font-weight:700;min-height:40px;padding:6px 10px}
.mark-in.bad{border-color:var(--red);background:var(--red-l)}
.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:800;font-size:13px;background:var(--slate-l)}
.g-A,.g-B{background:var(--green-l);color:var(--green)} .g-C{background:var(--blue-l);color:var(--blue)} .g-D,.g-E{background:var(--amber-l);color:var(--amber)} .g-F{background:var(--red-l);color:var(--red)}
.savebar{position:sticky;bottom:72px;z-index:30;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,.14);margin-top:12px}
@media(min-width:820px){.savebar{bottom:12px}}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{border-radius:16px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px} .modal-head h3{font-size:17px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toast-root{position:fixed;left:12px;right:12px;bottom:84px;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:11px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:520px}
.toast.error{background:#b91c1c} .toast.success{background:#166534}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0f2557,#2563eb 120%)}
.auth-card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-card h1{font-size:22px;margin:12px 0 4px} .auth-top{display:flex;justify-content:space-between;align-items:center}
.pwd{position:relative} .pwd button{position:absolute;right:4px;top:3px}
#print-root{display:none}
@media print{body.printing>*:not(#print-root){display:none!important} body.printing #print-root{display:block}
  #print-root h2{margin:0 0 4px} #print-root table{width:100%;border-collapse:collapse;font-size:12px} #print-root th,#print-root td{border:1px solid #999;padding:4px 6px;text-align:left} #print-root .num{text-align:right}}

/* ===== NEW LOOK (hero, logo, colours) ===== */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,#0f2557 0%,#1d4ed8 70%,#3b82f6 100%);box-shadow:0 10px 30px rgba(29,78,216,.28)}
.hero>*{position:relative;z-index:1}
.hero>.hero-art{position:absolute;z-index:0;right:-6px;top:50%;transform:translateY(-50%);width:230px;opacity:.9}
.hero-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hero-top b{display:block;font-size:15px;line-height:1.2}
.hero-top span{display:block;font-size:12px;opacity:.75}
.hero h2{font-size:23px;margin:0 0 2px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.85;font-size:13.5px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.25}
.hero-chip b{display:block;font-size:18px}
.hero-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;background:#fff;color:#1d4ed8;font-weight:700;font-size:13px;border:0;cursor:pointer;text-decoration:none}
.hero-btn.ghost{background:rgba(255,255,255,.18);color:#fff}
@media(max-width:560px){.hero>.hero-art{width:150px;opacity:.28}.hero h2{font-size:20px}}
.grid>.stat:nth-child(1){border-top:4px solid #2563eb}.grid>.stat:nth-child(2){border-top:4px solid #16a34a}.grid>.stat:nth-child(3){border-top:4px solid #f59e0b}.grid>.stat:nth-child(4){border-top:4px solid #8b5cf6}
.stat b{font-size:28px}.card{transition:transform .15s,box-shadow .15s}.list-item:active{background:var(--blue-l)}
.tabbar a.on span{font-weight:800}
.auth,.auth-main,.auth-brand{background-repeat:no-repeat}
.auth::after{content:"";position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 150%22%3E%3Ccircle cx=%22196%22 cy=%2234%22 r=%2216%22 fill=%22%23fde68a%22/%3E%3Cellipse cx=%2260%22 cy=%2230%22 rx=%2222%22 ry=%228%22 fill=%22%23fff%22 opacity=%22.35%22/%3E%3Cellipse cx=%2276%22 cy=%2224%22 rx=%2214%22 ry=%227%22 fill=%22%23fff%22 opacity=%22.35%22/%3E%3Crect y=%22128%22 width=%22240%22 height=%2222%22 fill=%22%230b1d45%22 opacity=%22.35%22/%3E%3Crect x=%2270%22 y=%2262%22 width=%22100%22 height=%2268%22 rx=%223%22 fill=%22%23fff%22/%3E%3Cpath d=%22M62 64 120 32l58 32z%22 fill=%22%23f59e0b%22/%3E%3Crect x=%22110%22 y=%2294%22 width=%2220%22 height=%2236%22 rx=%223%22 fill=%22%232563eb%22/%3E%3Crect x=%2282%22 y=%2276%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Crect x=%22142%22 y=%2276%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Crect x=%2282%22 y=%22100%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Crect x=%22142%22 y=%22100%22 width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23bfdbfe%22/%3E%3Ccircle cx=%22120%22 cy=%2252%22 r=%226%22 fill=%22%232563eb%22/%3E%3Cpath d=%22M120 32V14%22 stroke=%22%23fff%22 stroke-width=%222%22/%3E%3Cpath d=%22M120 14h16l-4 5 4 5h-16z%22 fill=%22%23ef4444%22/%3E%3Ccircle cx=%2230%22 cy=%22112%22 r=%2216%22 fill=%22%2322c55e%22/%3E%3Crect x=%2228%22 y=%22120%22 width=%224%22 height=%2212%22 fill=%22%2392400e%22/%3E%3Ccircle cx=%22212%22 cy=%22116%22 r=%2212%22 fill=%22%2316a34a%22/%3E%3Crect x=%22210%22 y=%22122%22 width=%224%22 height=%2210%22 fill=%22%2392400e%22/%3E%3C/svg%3E") center bottom/auto 150px repeat-x;opacity:.55}
.auth-card{position:relative;z-index:1}

ACT['m-view'] = el => { M.view = el.dataset.id; renderMarks(); };

async function marksEntry() {

function scoreOf(r) { if (r.val === null || r.val === '') return null; const x = num(r.val); return Number.isFinite(x) ? x : NaN; }
function markCalc(tr, i) {

function markSum() {

function resRows() { const { res, list } = M.res; const cols = [{ k: 'adm', l: t('admission_no') }, { k: 'name', l: t('student') }, ...list.map((a, i) => ({ k: 'c' + i, l: `${a.name} (/${+a.max_marks})` })), { k: 'tot', l: t('total_score') }, { k: 'mx', l: t('total_max') }, { k: 'pct', l: '%' }, { k: 'gr', l: t('grade') }, { k: 'rank', l: t('rank') }];

/* =====================================================================
   BOOT
   ===================================================================== */
let started = false;
async function start(session) {
  if (started) return; started = true;
  try { await loadContext(session); if (S.ready) { renderShell(); route(); if (window.__recovery) { window.__recovery = false; ACT.profile(); } } }
  catch (e) { console.error(e); notice(t('err_ctx'), errMsg(e)); }
  finally { started = false; }
}
(function boot() {
  document.documentElement.lang = LANG;
  if (!sb) { $('#boot').hidden = true; return; }
  let timer = setTimeout(() => { if (!$('#boot').hidden) showAuth('login'); }, 4000);
  sb.auth.onAuthStateChange((ev, session) => {
    clearTimeout(timer);
    setTimeout(() => {   // deferred: never call Supabase inside the auth callback itself
      if (session && session.user) { if (ev === 'TOKEN_REFRESHED' && S.ready) return; if (ev === 'PASSWORD_RECOVERY') window.__recovery = true; start(session); }
      else { lockdown(); showAuth('login'); }
    }, 0);
  });
})();
